    <line x1="26" y1="98" x2="934" y2="98" stroke="#CBD6E0" stroke-width="1" opacity="0.7"/>
    <line x1="26" y1="134" x2="934" y2="134" stroke="#CBD6E0" stroke-width="1" opacity="0.7"/>
    <line x1="26" y1="170" x2="934" y2="170" stroke="#CBD6E0" stroke-width="1" opacity="0.7"/>
  </g>
  <g transform="translate(10,12) rotate(-14)">  <rect x="0" y="0" width="62" height="16" rx="1.5" fill="#EDE7D5" fill-opacity="0.78" stroke="#CFC7B2" stroke-width="0.9"/></g>
  <g transform="translate(886,12) rotate(12)">  <rect x="0" y="0" width="62" height="16" rx="1.5" fill="#EDE7D5" fill-opacity="0.78" stroke="#CFC7B2" stroke-width="0.9"/></g>
  <g transform="translate(828,3) rotate(6) scale(0.92)">  <path d="M 10 42 L 10 12 C 10 4, 24 4, 24 12 L 24 46 C 24 56, 6 56, 6 46 L 6 18 C 6 12, 18 12, 18 18 L 18 40"         fill="none" stroke="#68736D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>  <path d="M 10 42 L 10 12 C 10 4, 24 4, 24 12 L 24 46 C 24 56, 6 56, 6 46 L 6 18 C 6 12, 18 12, 18 18 L 18 40"         fill="none" stroke="#DCE3DF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g>

