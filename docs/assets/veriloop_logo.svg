<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 184" width="960" height="184" role="img" aria-label="VeriLoop — Full-Stack Autonomous Research Engine &amp; Deterministic Verification Kernel">
  <defs>
    <radialGradient id="logo-glow" cx="22%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9B8B6C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#171614" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="956" height="180" rx="16" fill="#171614" stroke="#2F2D27" stroke-width="2"/>
  <rect x="2" y="2" width="956" height="180" rx="16" fill="url(#logo-glow)"/>

  <!-- Precision Verification Loop Mark -->
  <g transform="translate(88, 92)">
    <circle cx="0" cy="0" r="42" fill="#201F1B" stroke="#36332C" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#F4F1EA" stroke-width="3.6" stroke-dasharray="144 44" stroke-linecap="round" transform="rotate(-24)"/>
    <circle cx="24" cy="-18" r="4" fill="#7CC4FA"/>
    <path d="M -14 1 L -4 11 L 16 -11" fill="none" stroke="#4ADE80" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="96" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="56" font-weight="700" letter-spacing="-1.2" fill="#F6F3EC">VeriLoop</text>

  <!-- Version pill -->
  <rect x="424" y="59" width="70" height="28" rx="14" fill="#24221E" stroke="#464239" stroke-width="1.2"/>
  <text x="459" y="77" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#4ADE80">v5.0</text>

  <!-- Subtitle -->
  <text x="162" y="132" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.4" fill="#B5AFA2">AUTONOMOUS RESEARCH ENGINE  ·  DETERMINISTIC VERIFICATION KERNEL</text>

  <!-- Right subtle telemetry badges -->
  <g transform="translate(758, 52)">
    <rect x="0" y="0" width="168" height="32" rx="6" fill="#1F2421" stroke="#2D4A38" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4" fill="#4ADE80"/>
    <text x="28" y="20" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#BBF7D0">416/416 TRACED</text>

    <rect x="0" y="44" width="168" height="32" rx="6" fill="#1C2129" stroke="#2D3C52" stroke-width="1.2"/>
    <circle cx="16" cy="60" r="4" fill="#7CC4FA"/>
    <text x="28" y="64" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#BAE6FD">ZERO RUNTIME DEPS</text>
