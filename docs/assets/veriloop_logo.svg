  <text x="896" y="100" text-anchor="end" font-family="'Kevin Sans', Georgia, serif" font-size="16" font-weight="700" fill="#2A5CA8">416 / 416 traced!</text>
  <text x="896" y="122" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#545E58">0 deps · 63/63 CI</text>
