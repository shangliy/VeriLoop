<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" role="img" aria-label="VeriLoop — Hand-Drawn Looseleaf Banner">
  <defs>
    <filter id="paper-shadow" x="-4%" y="-6%" width="108%" height="118%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E2E27" flood-opacity="0.18"/>
    </filter>
    <pattern id="desk-grain" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.6" fill="#89A89B" opacity="0.45"/>
      <circle cx="9" cy="8" r="0.55" fill="#C4DBD0" opacity="0.35"/>
    </pattern>
    <pattern id="paper-grain" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.55" fill="#D5CCB8" opacity="0.38"/>
      <circle cx="11" cy="12" r="0.5" fill="#DFD7C4" opacity="0.32"/>
    </pattern>
    <marker id="pen-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 2 L 8.5 5 L 1 8" fill="none" stroke="#1E2421" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="orange-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 2 L 8.5 5 L 1 8" fill="none" stroke="#C44536" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="green-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 2 L 8.5 5 L 1 8" fill="none" stroke="#3B6E4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Sage desk mat frame -->
