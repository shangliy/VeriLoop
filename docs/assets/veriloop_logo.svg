    <path d="M 36.8 -10.6 L 37.5 -2.5 L 37.6 5.1 L 35.4 13.4 L 31.2 21.9 L 26.8 29.6 L 18.7 32.1 L 11.2 35.2 L 2.6 39.5 L -5.6 38.6 L -12.7 34.0 L -22.8 33.3 L -28.0 25.9 L -33.1 19.2 L -35.2 10.9 L -38.3 2.6 L -37.1 -5.6 L -35.3 -13.3 L -30.4 -20.7 L -26.5 -27.7 L -20.0 -34.4 L -11.5 -38.0 L -2.4 -36.4 L 5.3 -37.3 L 13.9 -36.7 L 22.9 -33.5 L 28.3 -26.2 L 34.2 -19.3 L 35.5 -11.5 L 36.2 -3.2 L 38.8 6.2 L 37.2 13.7" fill="none" stroke="#1E2421" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
