<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 132" width="760" height="132">
  <!-- Archival paper card so the wordmark stays legible on both GitHub light & dark themes without neon gradients -->
  <rect x="2" y="2" width="756" height="128" rx="12" fill="#FCFBF8" stroke="#D8D4C9" stroke-width="1.5"/>

  <!-- Subtle architectural registration ticks -->
  <g stroke="#CFCAC0" stroke-width="1">
    <line x1="20" y1="20" x2="28" y2="20"/><line x1="20" y1="20" x2="20" y2="28"/>
    <line x1="740" y1="20" x2="732" y2="20"/><line x1="740" y1="20" x2="740" y2="28"/>
    <line x1="20" y1="112" x2="28" y2="112"/><line x1="20" y1="112" x2="20" y2="104"/>
    <line x1="740" y1="112" x2="732" y2="112"/><line x1="740" y1="112" x2="740" y2="104"/>
  </g>

  <!-- Minimal geometric mark: closed verification loop + precision check -->
  <g transform="translate(46, 30)">
    <rect x="0" y="0" width="72" height="72" rx="14" fill="#18181B"/>
    <circle cx="36" cy="36" r="22" fill="none" stroke="#FAF9F5" stroke-width="3.2" stroke-dasharray="106 24" stroke-linecap="round"/>
    <polygon points="52,18 61,27 48,28" fill="#4ADE80"/>
    <path d="M26 36.5 L33 43.5 L47 28.5" fill="none" stroke="#4ADE80" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Editorial Wordmark -->
  <text x="142" y="75" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#141413">Veri<tspan fill="#0F4C81">Loop</tspan></text>

  <!-- Hairline vertical rule -->
  <line x1="382" y1="34" x2="382" y2="98" stroke="#DDD8CD" stroke-width="1.2"/>

  <!-- Concise editorial descriptors (zero fake dashboards or glowing badges) -->
  <text x="406" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1C1917" letter-spacing="-0.2">Verifiable Autonomous Research Pipeline</text>
  <text x="406" y="81" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.8" fill="#57534E">Level-1/2 · $0 Hard Gates · Paper-Bind · Studio</text>
  <text x="406" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#15803D" font-weight="600">v5.0  ·  MIT OPEN SOURCE  ·  STDLIB CORE</text>
</svg>
