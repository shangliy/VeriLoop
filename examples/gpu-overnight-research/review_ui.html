logged simultaneously to TensorBoard, W\\&B, CSV, and an append-only ledger.", "Across all 14 stages, VeriLoop ran an automated live Research Wiki self-consistency and AST smoke check (182 distinct numbers in the final wiki re-audited at each stage, 0 AST \\texttt{HIGH} findings, 81.8~ms median latency at \\$0 API cost), while independent audit logs under \\texttt{audits/} record 4/4 claims passing \\texttt{G1--G7}, 10/10 online-verified citations, and 100\\% of expanded PDF numbers traced with 0 untraced values.", "Empirically, \\texttt{M7\\_SEResNet\\_Full} reaches \\vlCMSeresnetFullTestAcc{} CIFAR-10 test accuracy (+14.06~pp over \\texttt{M1\\_PlainCNN}'s \\vlCMPlaincnnTestAcc{}).", "Unaugmented \\texttt{M2\\_ResNet\\_Base} is strongly overconfident on CIFAR-10 (raw ECE \\vlCMResnetBaseTestEce{}, $T^*=\\vlCMResnetBaseTempTMean{}$; milder on Fashion-MNIST, $T^*=\\vlFMResnetBaseTempTMean{}$), whereas Label Smoothing (\\texttt{M5\\_ResNet\\_LS}, $T^*=\\vlCMResnetLsTempTMean{}$ on CIFAR-10 and \\vlFMResnetLsTempTMean{} on Fashion-MNIST) and CIFAR-10 Mixup (\\texttt{M6\\_ResNet\\_Mixup}, $T^*=\\vlCMResnetMixupTempTMean{}$) invert into underconfidence, raising raw ECE until validation-fitted Temperature Scaling restores CIFAR-10 calibrated ECE across \\texttt{M4}--\\texttt{M7} to \\vlCMResnetAugCosineCalEce{}--\\vlCMSeresnetFullCalEce{} (\\vlCMResnetLsCalEce{} for LS and \\vlCMResnetMixupCalEce{} for Mixup).", "\\end{abstract}", "", "\\section{Introduction and Governance Protocol}", "", "Autonomous research pipelines frequently fail silently during long-horizon multi-stage studies through stale number copying, test-set checkpoint peeking, unverified citations, or cherry-picked cross-dataset claims~\\citep{yang2026aris}.", "This artifact demonstrates VeriLoop's verifiable writing and experimentation pipeline on a genuine multi-seed GPU deep learning investigation rather than a short CPU script.", "", "Prior to launching the first GPU run, four hypotheses (\\texttt{H1\\_ResidualGain}--\\texttt{H4\\_CrossDatasetRank}) were registered in \\texttt{claims.json} with explicit kill criteria and SHA-256 log-integrity gates (\\texttt{G1--G7}); note that \\texttt{claims.json} was committed alongside results in this showcase, whereas production pre-registration should anchor \\texttt{claims.json} in an earlier commit.", "Every training run uses identical fixed train/validation splits (45,000/5,000 on CIFAR-10; 50,000/10,000 on Fashion-MNIST~\\citep{xiao2017fashion}), selects the best epoch strictly by validation accuracy, fits post-hoc Temperature Scaling $T^*$~\\citep{guo2017calibration} exclusively on validation logits via L-BFGS, and evaluates the 10,000-example held-out test set exactly once.", "After every stage completes, \\texttt{run\\_overnight\\_study.py} updates \\texttt{wiki/RESEARCH\\_WIKI.md} and invokes \\texttt{trace\\_numbers.py} and \\texttt{audit\\_code.py --strict} as a live pipeline self-consistency and AST smoke check (recording every event in \\texttt{out/gate\\_audit\\_trace.jsonl}).", "Every per-arm metric cell and $T^*$ value in Tables~\\ref{tab:c10}--\\ref{tab:fmnist} is injected directly via \\LaTeX{} macros generated by \\texttt{./veriloop bind} from raw TensorBoard (\\texttt{.tfevents}) and W\\&B run files (while aggregate deltas and compute totals trace to \\texttt{out/overnight\\_summary.txt}), and all 10 cited references are verified online against arXiv, Crossref, and Semantic Scholar via \\texttt{./veriloop verify-cites} (committed in \\texttt{audits/}).", "", "\\section{Experimental Design}", "", "We construct an 8-stage progressive recipe ladder on CIFAR-10 (30 epochs, batch size 256, AMP fp16, seeds 42/43/44; 24 runs) and a 6-stage core ladder on Fashion-MNIST (15 epochs, seeds 42/43/44; 18 runs). Because adjacent stages bundle standard training recipe changes rather than isolating single hyperparameters, we interpret accuracy shifts at the recipe-bundle level:", "\\begin{enumerate}", "  \\item \\texttt{M0\\_Linear}: Linear classifier baseline (AdamW, LR $2\\times 10^{-3}$, WD $10^{-4}$).", "  \\item \\texttt{M1\\_PlainCNN}: 4-layer ConvNet (widths 32--64--128, AdamW, WD 0) without BatchNorm or skip connections.", "  \\item \\texttt{M2\\_ResNet\\_Base}: 3-stage CIFAR ResNet-14 (greater depth/capacity plus residual shortcuts~\\citep{he2015deep} and BatchNorm~\\citep{ioffe2015batch}, constant-LR AdamW, no augmentation).", "  \\item \\texttt{M3\\_ResNet\\_Aug}: Adds padding-4 random crop, horizontal flip, and weight decay ($10^{-4}$).", "  \\item \\texttt{M4\\_ResNet\\_Aug\\_Cosine}: Switches optimizer bundle to Nesterov SGD (LR 0.1, WD $5\\times 10^{-4}$) with 3-epoch linear warmup and cosine annealing~\\citep{loshchilov2016sgdr}.", "  \\item \\texttt{M5\\_ResNet\\_LS}: Adds Label Smoothing ($\\epsilon=0.1$)~\\citep{szegedy2015rethinking} to \\texttt{M4}.", "  \\item \\texttt{M6\\_ResNet\\_Mixup}: Replaces Label Smoothing with Mixup ($\\alpha=0.4$)~\\citep{zhang2017mixup} (CIFAR-10 only).", "  \\item \\texttt{M7\\_SEResNet\\_Full}: Bundles Squeeze-and-Excitation attention~\\citep{hu2017squeeze}, $8\\times 8$ Cutout~\\citep{devries2017improved}, cosine SGD, and mild label smoothing ($\\epsilon=0.05$).", "\\end{enumerate}", "", "\\begin{figure*}[t]", "  \\centering", "  \\includegraphics[width=\\textwidth]{figures/fig_cifar10_ablation_and_ece.pdf}", "  \\caption{\\textbf{CIFAR-10 progressive recipe ladder (24 RTX 3060 Ti runs, 30 epochs, 3 seeds) reveals strong accuracy gains alongside a non-monotonic calibration reversal.} (a) Held-out test accuracy (mean $\\pm$ 95\\% $t$-CI) climbs from \\texttt{M0\\_Linear} (\\vlCMLinearTestAccMean{}) to \\texttt{M7\\_SEResNet\\_Full} (\\vlCMSeresnetFullTestAccMean{}). (b) Unaugmented \\texttt{M2\\_ResNet\\_Base} exhibits severe overconfidence (raw ECE \\vlCMResnetBaseTestEceMean{}), whereas Label Smoothing (\\texttt{M5}) and Mixup (\\texttt{M6}) induce underconfidence ($T^*<1$); strictly validation-fitted post-hoc Temperature Scaling reduces ECE across every residual arm.}", "  \\label{fig:c10_ablation}", "\\end{figure*}", "", "\\section{Results: Accuracy, Calibration, and Gate Trace}", "", "\\paragraph{CIFAR-10 progressive recipe gains (Table~\\ref{tab:c10}, Figure~\\ref{fig:c10_ablation}).}", "Moving from \\texttt{M1\\_PlainCNN} (\\vlCMPlaincnnTestAcc{}) to the deeper residual+BatchNorm \\texttt{M2\\_ResNet\\_Base} (\\vlCMResnetBaseTestAcc{}) improves CIFAR-10 held-out test accuracy across all three seeds, supporting \\texttt{H1\\_ResidualGain}.", "Adding augmentation plus weight decay (\\texttt{M3\\_ResNet\\_Aug}, \\vlCMResnetAugTestAcc{}) and switching to warmup-cosine Nesterov SGD (\\texttt{M4\\_ResNet\\_Aug\\_Cosine}, \\vlCMResnetAugCosineTestAcc{}) produce the largest bundled jumps, while \\texttt{M7\\_SEResNet\\_Full} reaches \\vlCMSeresnetFullTestAcc{} (95\\% CI \\vlCMSeresnetFullTestAccCi{}, delta +0.1406 / +14.06~pp over \\texttt{M1\\_PlainCNN}), supporting \\texttt{H2\\_AugCosineGain}.", "By contrast, the modest accuracy differences of \\texttt{M5\\_ResNet\\_LS} (+0.0021) and \\texttt{M6\\_ResNet\\_Mixup} (\\vlCMResnetMixupTestAcc{}) over \\texttt{M4} lie within 3-seed CI overlap.", "", "\\begin{table*}[t]", "\\centering", "\\caption{\\textbf{CIFAR-10 multi-seed held-out test results (30 epochs, 3 seeds, 24 GPU runs) auto-bound from TensorBoard and W\\&B logs.} Every cell (including Mean $T^*$) is injected via \\texttt{paper\\_bind.py} macros; $T^*$ is fit strictly on validation logits.}", "\\label{tab:c10}", "\\setlength{\\tabcolsep}{3.6pt}", "\\footnotesize", "\\resizebox{\\textwidth}{!}{%", "\\begin{tabular}{lccccccc}", "\\toprule", "\\textbf{Method} & \\textbf{Val Acc} & \\textbf{Test Acc} & \\textbf{Raw ECE $\\downarrow$} & \\textbf{Cal ECE $\\downarrow$} & \\textbf{Raw NLL $\\downarrow$} & \\textbf{Cal NLL $\\downarrow$} & \\textbf{Mean $T^*$} \\\\", "\\midrule", "\\texttt{M0\\_Linear}            & \\vlCMLinearValAcc{}          & \\vlCMLinearTestAcc{}          & \\vlCMLinearTestEce{}          & \\vlCMLinearCalEce{}          & \\vlCMLinearTestNll{}          & \\vlCMLinearCalNll{}          & \\vlCMLinearTempTMean{} \\\\", "\\texttt{M1\\_PlainCNN}          & \\vlCMPlaincnnValAcc{}        & \\vlCMPlaincnnTestAcc{}        & \\vlCMPlaincnnTestEce{}        & \\vlCMPlaincnnCalEce{}        & \\vlCMPlaincnnTestNll{}        & \\vlCMPlaincnnCalNll{}        & \\vlCMPlaincnnTempTMean{} \\\\", "\\texttt{M2\\_ResNet\\_Base}      & \\vlCMResnetBaseValAcc{}      & \\vlCMResnetBaseTestAcc{}      & \\vlCMResnetBaseTestEce{}      & \\vlCMResnetBaseCalEce{}      & \\vlCMResnetBaseTestNll{}      & \\vlCMResnetBaseCalNll{}      & \\vlCMResnetBaseTempTMean{} \\\\", "\\texttt{M3\\_ResNet\\_Aug}       & \\vlCMResnetAugValAcc{}       & \\vlCMResnetAugTestAcc{}       & \\vlCMResnetAugTestEce{}       & \\vlCMResnetAugCalEce{}       & \\vlCMResnetAugTestNll{}       & \\vlCMResnetAugCalNll{}       & \\vlCMResnetAugTempTMean{} \\\\", "\\texttt{M4\\_ResNet\\_Aug\\_Cosine} & \\vlCMResnetAugCosineValAcc{} & \\vlCMResnetAugCosineTestAcc{} & \\vlCMResnetAugCosineTestEce{} & \\textbf{\\vlCMResnetAugCosineCalEce{}} & \\vlCMResnetAugCosineTestNll{} & \\textbf{\\vlCMResnetAugCosineCalNll{}} & \\vlCMResnetAugCosineTempTMean{} \\\\", "\\texttt{M5\\_ResNet\\_LS}        & \\vlCMResnetLsValAcc{}        & \\vlCMResnetLsTestAcc{}        & \\vlCMResnetLsTestEce{}        & \\vlCMResnetLsCalEce{}        & \\vlCMResnetLsTestNll{}        & \\vlCMResnetLsCalNll{}        & \\vlCMResnetLsTempTMean{} \\\\", "\\texttt{M6\\_ResNet\\_Mixup}     & \\vlCMResnetMixupValAcc{}     & \\vlCMResnetMixupTestAcc{}     & \\vlCMResnetMixupTestEce{}     & \\vlCMResnetMixupCalEce{}     & \\vlCMResnetMixupTestNll{}     & \\vlCMResnetMixupCalNll{}     & \\vlCMResnetMixupTempTMean{} \\\\", "\\texttt{M7\\_SEResNet\\_Full}    & \\textbf{\\vlCMSeresnetFullValAcc{}} & \\textbf{\\vlCMSeresnetFullTestAcc{}} & \\vlCMSeresnetFullTestEce{} & \\vlCMSeresnetFullCalEce{} & \\textbf{\\vlCMSeresnetFullTestNll{}} & \\vlCMSeresnetFullCalNll{} & \\vlCMSeresnetFullTempTMean{} \\\\", "\\bottomrule", "\\end{tabular}}", "\\end{table*}", "", "\\paragraph{Calibration reversal under Label Smoothing and Mixup.}", "Consistent with \\citet{guo2017calibration}, unaugmented \\texttt{M2\\_ResNet\\_Base} suffers severe overconfidence on CIFAR-10 (raw ECE \\vlCMResnetBaseTestEce{}, raw NLL \\vlCMResnetBaseTestNll{}), which validation-fitted $T^*=\\vlCMResnetBaseTempTMean{}$ reduces to calibrated ECE \\vlCMResnetBaseCalEce{} and calibrated NLL \\vlCMResnetBaseCalNll{}.", "Similarly, \\texttt{M4\\_ResNet\\_Aug\\_Cosine} drops from raw ECE \\vlCMResnetAugCosineTestEce{} to \\vlCMResnetAugCosineCalEce{} ($T^*=\\vlCMResnetAugCosineTempTMean{}$), achieving both the lowest calibrated ECE and lowest calibrated NLL (\\vlCMResnetAugCosineCalNll{}) across all eight CIFAR-10 arms.", "Training-time target softening inverts the direction of miscalibration: \\texttt{M5\\_ResNet\\_LS} raises raw ECE by +0.0295 to \\vlCMResnetLsTestEce{} ($T^*=\\vlCMResnetLsTempTMean{} < 1$, underconfident), and \\texttt{M6\\_ResNet\\_Mixup} (tested on CIFAR-10 only) reaches raw ECE \\vlCMResnetMixupTestEce{} ($T^*=\\vlCMResnetMixupTempTMean{}$).", "Sharpening logits with validation-fitted $T^*<1$ recovers calibrated ECE to \\vlCMResnetLsCalEce{} (delta $-0.0503$) for \\texttt{M5} and \\vlCMResnetMixupCalEce{} for \\texttt{M6}, confirming \\texttt{H3\\_CalibrationTradeoff}.", "", "\\begin{figure*}[t]", "  \\centering", "  \\includegraphics[width=\\textwidth]{figures/fig_acc_ece_pareto.pdf}", "  \\caption{\\textbf{Cross-dataset Accuracy--ECE Pareto frontier across CIFAR-10 (24 runs) and Fashion-MNIST (18 runs).} Circles show raw held-out test models and triangles show post-hoc validation-fitted Temperature Scaling ($T^*$); arrows trace the exact calibration shift for each method.}", "  \\label{fig:pareto}", "\\end{figure*}", "", "\\paragraph{Cross-dataset validation and honest nuance on Fashion-MNIST (Table~\\ref{tab:fmnist}, Figure~\\ref{fig:pareto}).}", "On Fashion-MNIST (15 epochs, 18 runs; Mixup omitted), \\texttt{M2\\_ResNet\\_Base} (\\vlFMResnetBaseTestAcc{}) again outperforms \\texttt{M1\\_PlainCNN} (\\vlFMPlaincnnTestAcc{}), and \\texttt{M7\\_SEResNet\\_Full} (\\vlFMSeresnetFullTestAcc{}) improves by +0.0375 (+3.75~pp) over \\texttt{M1\\_PlainCNN}, supporting \\texttt{H4\\_CrossDatasetRank}.", "The Label Smoothing underconfidence reversal reproduces cleanly on Fashion-MNIST: \\texttt{M5\\_ResNet\\_LS} lifts raw ECE by +0.0603 over \\texttt{M4\\_ResNet\\_Aug\\_Cosine} to \\vlFMResnetLsTestEce{} ($T^*=\\vlFMResnetLsTempTMean{}$), and validation-fitted $T^*$ reduces it by $-0.0581$ to \\vlFMResnetLsCalEce{}.", "Two honest nuances merit reporting without cherry-picking: (1) on already well-calibrated \\texttt{M1\\_PlainCNN} (raw ECE \\vlFMPlaincnnTestEce{}, $T^*=\\vlFMPlaincnnTempTMean{}$), post-hoc temperature scaling slightly increases test ECE to \\vlFMPlaincnnCalEce{}; and (2) \\texttt{M7\\_SEResNet\\_Full} (\\vlFMSeresnetFullTestAcc{}) slightly trails \\texttt{M4\\_ResNet\\_Aug\\_Cosine} (\\vlFMResnetAugCosineTestAcc{}) and \\texttt{M5\\_ResNet\\_LS} (\\vlFMResnetLsTestAcc{}), which we conjecture stems from $8\\times 8$ Cutout occluding a larger fraction of $28\\times 28$ grayscale garments than $32\\times 32$ RGB scenes.", "", "\\begin{table*}[t]", "\\centering", "\\caption{\\textbf{Fashion-MNIST cross-dataset results (15 epochs, 3 seeds, 18 GPU runs) auto-bound from TensorBoard and W\\&B logs.} Every cell (including Mean $T^*$) is injected via \\texttt{paper\\_bind.py} macros.}", "\\label{tab:fmnist}", "\\setlength{\\tabcolsep}{3.6pt}", "\\footnotesize", "\\resizebox{\\textwidth}{!}{%", "\\begin{tabular}{lccccccc}", "\\toprule", "\\textbf{Method} & \\textbf{Val Acc} & \\textbf{Test Acc} & \\textbf{Raw ECE $\\downarrow$} & \\textbf{Cal ECE $\\downarrow$} & \\textbf{Raw NLL $\\downarrow$} & \\textbf{Cal NLL $\\downarrow$} & \\textbf{Mean $T^*$} \\\\", "\\midrule", "\\texttt{M0\\_Linear} 7_SEResNet_Full\",", "]", "", "", "def agg(items, key):", "    vs = [float(x[key]) for x in items]", "    m = statistics.mean(vs)", "    s = statistics.stdev(vs) if len(vs) > 1 else 0.0", "    half = T_CRIT_95.get(len(vs) - 1, 1.96) * (s / math.sqrt(len(vs))) if len(vs) > 1 else 0.0", "    return m, s, m - half, m + half", "", "", "def main():", "    ledger = WS / \"out/trajectory_ledger.jsonl\"", "    rows = [json.loads(l) for l in ledger.read_text(encoding=\"utf-8\").splitlines() if l.strip()]", "    gate_rows = [", "        json.loads(l)", "        for l in (WS / \"out/gate_audit_trace.jsonl\").read_text(encoding=\"utf-8\").splitlines()", "        if l.strip()", "    ]", "", "    # Run ./veriloop bind per dataset so macros, tables, and manifests are auto-generated (including temp_T)", "    for ds in sorted({r[\"dataset\"] for r in rows}):", "        prefix = \"vlC\" if ds == \"cifar10\" else \"vlF\"", "        subprocess.run(", "            [", "                sys.executable, str(REPO_ROOT / \"tools/paper_bind.py\"),", "                \"--inputs\", str(WS / \"runs/tb\" / ds), str(WS / \"runs/wandb\" / ds),", "                \"--metrics\", \"val_acc\", \"test_acc\", \"test_ece\", \"cal_ece\", \"test_nll\", \"cal_nll\", \"temp_T\",", "                \"--curve-metric\", \"val_acc\",", "                \"--macro-prefix\", prefix,", "                \"--out-dir\", str(WS / \"paper/bound\" / ds),", "            ],", "            check=True,", "        )", "", "    by_dm = defaultdict(list)", "    for r in rows:", "        by_dm[(r[\"dataset\"], r[\"method\"])].append(r)", "", "    total_gpu_s = sum(float(r[\"wall_time_s\"]) for r in rows)", "    max_vram = max(float(r[\"peak_vram_mb\"]) for r in rows)", "    gpu_name = rows[0][\"device\"]", "    torch_ver = rows[0][\"torch_version\"]", "", "    lines = [", "        \"=== VERILOOP OVERNIGHT REAL-GPU STUDY SUMMARY (ZERO OVERRIDES) ===\",", "        f\"RUNS total_runs={len(rows)} gpu={gpu_name} torch={torch_ver} total_gpu_s={total_gpu_s:.1f} ({total_gpu_s/60.0:.2f} min) peak_vram_mb={max_vram:.1f}\",", "        f\"GATES stages_audited={len(gate_rows)} passed={sum(1 for g in gate_rows if g['passed'])}/{len(gate_rows)} \"", "        f\"final_wiki_numbers={gate_rows[-1]['traced'] if gate_rows else 0} total_untraced={sum(g['untraced'] for g in gate_rows)} \"", "        f\"total_ast_high={sum(g['ast_high'] for g in gate_rows)} median_gate_ms={statistics.median(g['gate_elapsed_ms'] for g in gate_rows):.1f}\",", "        \"\",", "    ]", "", "    for ds, order in [(\"cifar10\", ORDER_C10), (\"fmnist\", ORDER_FM)]:", "        lines.append(f\"--- DATASET: {ds} ---\")", "        for m in order:", "            its = by_dm.get((ds, m))", "            if not its:", "                continue", "            va = agg(its, \"val_acc\")", "            ta = agg(its, \"test_acc\")", "            re = agg(its, \"test_ece\")", "            ce = agg(its, \"cal_ece\")", "            rn = agg(its, \"test_nll\")", "            cn = agg(its, \"cal_nll\")", "            tb = agg(its, \"test_brier\")", "            cb = agg(its, \"cal_brier\")", "            tt = agg(its, \"temp_T\")", "            lines.append(", "                f\"SUMMARY {ds:7s} {m:20s} n={len(its)} | \"", "                f\"val_acc={va[0]:.4f}±{va[1]:.4f} test_acc={ta[0]:.4f}±{ta[1]:.4f} [{ta[2]:.4f},{ta[3]:.4f}] | \"", "                f\"raw_ece={re[0]:.4f}±{re[1]:.4f} cal_ece={ce[0]:.4f}±{ce[1]:.4f} | \"", "                f\"raw_nll={rn[0]:.4f}±{rn[1]:.4f} cal_nll={cn[0]:.4f}±{cn[1]:.4f} | \"", "                f\"raw_brier={tb[0]:.4f} cal_brier={cb[0]:.4f} T={tt[0]:.4f}\"", "            )", "        lines.append(\"\")", "", "    # Compute exact paired accuracy & ECE deltas on CIFAR-10 and Fashion-MNIST", "    for ds in (\"cifar10\", \"fmnist\"):", "        if (ds, \"M7_SEResNet_Full\") in by_dm and (ds, \"M1_PlainCNN\") in by_dm:", "            d_acc = statistics.mean(x[\"test_acc\"] for x in by_dm[(ds, \"M7_SEResNet_Full\")]) - statistics.mean(x[\"test_acc\"] for x in by_dm[(ds, \"M1_PlainCNN\")])", "            lines.append(f\"DELTA {ds} M7_SEResNet_Full_vs_M1_PlainCNN test_acc_delta={d_acc:+.4f} ({d_acc*100:+.2f} pp)\")", "        if (ds, \"M5_ResNet_LS\") in by_dm and (ds, \"M4_ResNet_Aug_Cosine\") in by_dm:", "            d_acc = statistics.mean(x[\"test_acc\"] for x in by_dm[(ds, \"M5_ResNet_LS\")]) - statistics.mean(x[\"test_acc\"] for x in by_dm[(ds, \"M4_ResNet_Aug_Cosine\")])", "            d_ece = statistics.mean(x[\"test_ece\"] for x in by_dm[(ds, \"M5_ResNet_LS\")]) - statistics.mean(x[\"test_ece\"] for x in by_dm[(ds, \"M4_ResNet_Aug_Cosine\")])", "            d_cal = statistics.mean(x[\"cal_ece\"] for x in by_dm[(ds, \"M5_ResNet_LS\")]) - statistics.mean(x[\"test_ece\"] for x in by_dm[(ds, \"M5_ResNet_LS\")])", "            lines.append(", "                f\"DELTA {ds} M5_LS_vs_M4_Cosine test_acc_delta={d_acc:+.4f} raw_ece_delta={d_ece:+.4f} \"", "                f\"M5_temp_scaling_ece_delta={d_cal:+.4f}\"", "            )", "    lines.append(\"COMPLETED_OK\")", "    (WS / \"out/overnight_summary.txt\").write_text(\"\\n\".join(lines) + \"\\n\", encoding=\"utf-8\")", "    print(\"\\n\".join(lines))", "", "    # ==================== PUBLICATION-GRADE OKABE-ITO VECTOR PDFs ====================", "    plt.rcParams.update({", "        \"font.family\": \"sans-serif\",", "        \"font.sans-serif\": [\"Helvetica\", \"Arial\", \"DejaVu Sans\"],", "        \"font.size\": 7.5, \"axes.labelsize\": 8.2, \"xtick.labelsize\": 7.0, \"ytick.labelsize\": 7.0,", "        \"legend.fontsize\": 6.6, \"legend.frameon\": False,", "        \"axes.spines.top\": False, \"axes.spines.right\": False,", "        \"pdf.fonttype\": 42, \"ps.fonttype\": 42,", "    })", "", "    # Figure 1: Progressive Ablation Ladder on CIFAR-10 (Test Acc + Raw vs Calibrated ECE)", "    c10_m = [m for m in ORDER_C10 if (\"cifar10\", m) in by_dm]", "    if c10_m:", "        fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(7.0, 2.85), gridspec_kw={\"wspace\": 0.28})", "        x = np.arange(len(c10_m))", "        short_map = {", "            \"M0_Linear\": \"M0 Linear\", \"M1_PlainCNN\": \"M1 PlainCNN\",", "            \"M2_ResNet_Base\": \"M2 ResNet\", \"M3_ResNet_Aug\": \"M3 +Aug\",", "            \"M4_ResNet_Aug_Cosine\": \"M4 +CosSGD\", \"M5_ResNet_LS\": \"M5 +LS\",", "            \"M6_ResNet_Mixup\": \"M6 +Mixup\", \"M7_SEResNet_Full\": \"M7 SE+Cut\",", "        }", "        short_lbl = [short_map.get(m, m) for m in c10_m]", "        ta_means = [agg(by_dm[(\"cifar10\", m)], \"test_acc\")[0] * 100 for m in c10_m]", "        ta_errs = [(agg(by_dm[(\"cifar10\", m)], \"test_acc\")[3] - agg(by_dm[(\"cifar10\", m)], \"test_acc\")[0]) * 100 for m in c10_m]", "        bars = ax1.bar(x, ta_means, 0.62, yerr=ta_errs, capsize=2.2, color=\"#0072B2\", edgecolor=\"#1F2937\", linewidth=0.55)", "        for b, v in zip(bars, ta_means):", "            ax1.text(b.get_x() + b.get_width() / 2, v + 1.8, f\"{v:.1f}\", ha=\"center\", va=\"bottom\", fontsize=5.8, fontweight=\"bold\")", "        ax1.set_xticks(x)", "        ax1.set_xticklabels(short_lbl, fontsize=6.2, rotation=28, ha=\"right\", rotation_mode=\"anchor\")", "        ax1.set_ylabel(\"CIFAR-10 Test Accuracy (%)\")", "        ax1.set_ylim(0, 108)", "        ax1.grid(axis=\"y\", linestyle=\":\", alpha=0.4)", "        ax1.set_axisbelow(True)", "        ax1.text(0.5, -0.36, \"(a) Progressive ablation ladder (mean ± 95% CI)\", transform=ax1.transAxes, ha=\"center\", fontsize=7.0, fontweight=\"bold\")", "", "        re_means = [agg(by_dm[(\"cifar10\", m)], \"test_ece\")[0] * 100 for m in c10_m]", "        ce_means = [agg(by_dm[(\"cifar10\", m)], \"cal_ece\")[0] * 100 for m in c10_m]", "        w = 0.36", "        ax2.bar(x - w / 2, re_means, w, label=\"Raw ECE (%)\", color=\"#D55E00\", edgecolor=\"#1F2937\", linewidth=0.55)", "        ax2.bar(x + w / 2, ce_means, w, label=\"Temp-Scaled ECE (%)\", color=\"#009E73\", edgecolor=\"#1F2937\", linewidth=0.55)", "        ax2.set_xticks(x)", "        ax2.set_xticklabels(short_lbl, fontsize=6.2, rotation=28, ha=\"right\", rotation_mode=\"anchor\")", "        ax2.set_ylabel(\"Expected Calibration Error (%) ↓\")", "        ax2.grid(axis=\"y\", linestyle=\":\", alpha=0.4)", "        ax2.set_axisbelow(True)", "        ax2.legend(loc=\"upper right\", fontsize=6.5)", "        ax2.text(0.5, -0.36, \"(b) Calibration trade-off: Raw vs. Val-Fitted T*\", transform=ax2.transAxes, ha=\"center\", fontsize=7.0, fontweight=\"bold\")", "", "        fig.subplots_adjust(bottom=0.28)", "        fig.savefig(FIG_DIR / \"fig_cifar10_ablation_and_ece.pdf\", bbox_inches=\"tight\")", "        plt.close(fig)", "", "    # Figure 2: Cross-Dataset Accuracy vs. ECE Pareto Frontier (CIFAR-10 + Fashion-MNIST)", "    fig, axes = plt.subplots(1, 2, figsize=(7.0, 2.75), gridspec_kw={\"wspace\": 0.30})", "    lbl_offsets = {", "        (\"cifar10\", \"M1_PlainCNN\"): (-1.6, 0.75),", "        (\"cifar10\", \"M2_ResNet_Base\"): (-2.4, -0.95),", "        (\"cifar10\", \"M3_ResNet_Aug\"): (0.35, -0.25),", "        (\"cifar10\", \"M4_ResNet_Aug_Cosine\"): (-0.3, -1.25),", "        (\"cifar10\", \"M5_ResNet_LS\"): (0.25, -1.15),", "        (\"cifar10\", \"M6_ResNet_Mixup\"): (0.25, 0.35),", "        (\"cifar10\", \"M7_SEResNet_Full\"): (0.35, 0.45),", "        (\"fmnist\", \"M1_PlainCNN\"): (0.25, 0.12),", "        (\"fmnist\", \"M2_ResNet_Base\"): (0.20, 0.18),", "        (\"fmnist\", \"M4_ResNet_Aug_Cosine\"): (0.15, 0.22),", "        (\"fmnist\", \"M5_ResNet_LS\"): (-1.55, 0.22),", "        (\"fmnist\", \"M7_SEResNet_Full\"): (0.20, -0.32),", "    }", "    short_p = {", "        \"M1_PlainCNN\": \"M1 PlainCNN\", \"M2_ResNet_Base\": \"M2 ResNet\",", "        \"M3_ResNet_Aug\": \"M3 +Aug\", \"M4_ResNet_Aug_Cosine\": \"M4 +CosSGD\",", "        \"M5_ResNet_LS\": \"M5 +LS\", \"M6_ResNet_Mixup\": \"M6 +Mixup\", \"M7_SEResNet_Full\": \"M7 SE+Cut\",", "    }", "    for ax, (ds, order, ttl) in zip(axes, [(\"cifar10\", ORDER_C10, \"(a) CIFAR-10 (30 epochs, 3 seeds)\"), (\"fmnist\", ORDER_FM, \"(b) Fashion-MNIST (15 epochs, 3 seeds)\")]):", "        ms = [m for m in order if (ds, m) in by_dm and m != \"M0_Linear\"]", "        for i, m in enumerate(ms):", "            ta = agg(by_dm[(ds, m)], \"test_acc\")[0] * 100", "            re = agg(by_dm[(ds, m)], \"test_ece\")[0] * 100", "            ce = agg(by_dm[(ds, m)], \"cal_ece\")[0] * 100", "            c = OKABE_ITO[i % len(OKABE_ITO)]", "            ax.scatter([re], [ta], color=c, marker=\"o\", s=34, edgecolor=\"#1F2937\", linewidth=0.6, zorder=4)", "            ax.scatter([ce], [ta], color=c, marker=\"^\", s=38, edgecolor=\"#1F2937\", linewidth=0.6, zorder=5)", "            ax.annotate(\"\", xy=(ce, ta), xytext=(re, ta), arrowprops=dict(arrowstyle=\"->\", color=c, lw=0.85, alpha=0.75))", "            dx, dy = lbl_offsets.get((ds, m), (0.2, 0.2))", "            ax.text(re + dx, ta + dy, short_p.get(m, m), fontsize=5.8, color=\"#1F2937\", fontweight=\"medium\")", "        ax.set_xlabel(\"Expected Calibration Error (%) ↓\")", "        ax.set_ylabel(\"Held-Out Test Accuracy (%) ↑\")", "        if ds == \"cifar10\":", "            ax.set_xlim(0.0, 13.8)", "            ax.set_ylim(76.4, 93.4)", "        else:", "            ax.set_xlim(0.0, 8.2)", "            ax.set_ylim(89.5, 94.6)", "        ax.grid(linestyle=\":\", alpha=0.4)", "        ax.text(0.5, -0.28, ttl, transform=ax.transAxes, ha=\"center\", fontsize=7.0, fontweight=\"bold\")", "    axes[0].scatter([], [], color=\"#4B5563\", marker=\"o\", s=26, label=\"Raw model\")", "    axes[0].scatter([], [], color=\"#4B5563\", marker=\"^\", s=28, label=\"Post-hoc Temp Scaling (val T*)\")", "    axes[0].legend(loc=\"lower right\", fontsize=6.2)", "    fig.subplots_adjust(bottom=0.24)", "    fig.savefig(FIG_DIR / \"fig_acc_ece_pareto.pdf\", bbox_inches=\"tight\")", "    plt.close(fig)", "", "    print(\"OVERNIGHT_FIGURES_WRITTEN -> paper/figures/\")", "", "", "if __name__ == \"__main__\":", "    main()"]}, "/home/shawnyang/Documents/VeriLoop/examples/gpu-overnight-research/code/run_overnight_study.py": {"path": "/home/shawnyang/Documents/VeriLoop/examples/gpu-overnight-research/code/run_overnight_study.py", "name": "run_overnight_study.py", "sha256": "afeca57cf5f00b10", "lines": ["#!/usr/bin/env python3", "\"\"\"VeriLoop Long-Horizon Real-GPU Research Study (Crash-Resumable, Zero-Fabrication).", "", "Executes an 8-stage progressive deep learning study across TWO real vision benchmarks", "(CIFAR-10 and Fashion-MNIST, 3 independent random seeds per arm, 42 total GPU runs)", "on CUDA with strict validation-only model & temperature-scaling selection:", "", "  CIFAR-10 (45k train / 5k val / 10k test, 30 epochs, AMP fp16):", "    1. M0_Linear            : Linear classifier baseline (G3 simple baseline)", "    2. M1_PlainCNN          : 4-stage ConvNet without BatchNorm or residual skips", "    3. M2_ResNet_Base       : 3-stage ResNet + BatchNorm (constant LR, no augmentation)", "    4. M3_ResNet_Aug        : + RandomCrop(4) & RandomHorizontalFlip", "    5. M4_ResNet_Aug_Cosine : + SGD(momentum=0.9, nesterov, wd=5e-4) + Warmup+CosineAnnealingLR", "    6. M5_ResNet_LS         : + Label Smoothing (eps=0.1)", "    7. M6_ResNet_Mixup      : + Mixup (alpha=0.4)", "    8. M7_SEResNet_Full     : + Squeeze-and-Excitation blocks + Cutout(8x8) + Cosine + WD", "", "  Fashion-MNIST (50k train / 10k val / 10k test, 15 epochs, AMP fp16):", "    Core 6-step ladder: M0_Linear, M1_PlainCNN, M2_ResNet_Base, M4_ResNet_Aug_Cosine,", "    M5_ResNet_LS, M7_SEResNet_Full.", "", "Every single run:", "  - Evaluates held-out test set STRICTLY ONCE on the validation-selected checkpoint.", "  - Fits post-hoc Temperature Scaling (T*) strictly on the validation logits, then measures", "    both raw and temperature-calibrated NLL, ECE (15-bin), and Brier score on held-out test.", "  - Logs simultaneously to TensorBoard (.tfevents), W&B local files, CSV, and append-only", "    crash-resumable `out/trajectory_ledger.jsonl`.", "  - Updates `wiki/RESEARCH_WIKI.md` and runs deterministic VeriLoop gates (`trace_numbers.py`", "    + `audit_code.py`) after EVERY completed iteration, recording the gate trace in", "    `out/gate_audit_trace.jsonl`.", "\"\"\"", "import argparse", "import csv", "import hashlib", "import json", "import math", "import random", "import statistics", "import subprocess", "import sys", "import time", "from collections import defaultdict", "from datetime import datetime, timezone", "from pathlib import Path", "", "import torch", "import torch.nn as nn", "import torch.nn.functional as F", "from torch.utils.data import DataLoader, Dataset, Subset", "from torchvision import datasets, transforms", "", "REPO_ROOT = Path(__file__).resolve().parents[3]", "RL_SCRIPTS = REPO_ROOT / \"skills/research-loop/scripts\"", "sys.path.insert(0, str(REPO_ROOT / \"tools\"))", "import paper_bind as pb  # noqa: E402", "", "", "def sha256_file(fp: Path) -> str:", "    h = hashlib.sha256()", "    with fp.open(\"rb\") as fh:", "        for chunk in iter(lambda: fh.read(65536), b\"\"):", "            h.update(chunk)", "    return h.hexdigest()", "", "", "def seed_everything(seed: int):", "    random.seed(seed)", "    torch.manual_seed(seed)", "    if torch.cuda.is_available():", "        torch.cuda.manual_seed_all(seed)", "    torch.backends.cudnn.benchmark = True", "", "", "# ==================== ARCHITECTURES ====================", "", "class LinearBaseline(nn.Module):", "    def __init__(self, in_ch: int, img_size: int, n_classes: int = 10):", "        super().__init__()", "        self.fc = nn.Linear(in_ch * img_size * img_size, n_classes)", "", "    def forward(self, x):", "        return self.fc(x.flatten(1))", "", "", "class PlainCNN(nn.Module):", "    def __init__(self, in_ch: int, n_classes: int = 10):", "        super().__init__()", "        self.net = nn.Sequential(", "            nn.Conv2d(in_ch, 32, 3, padding=1), nn.ReLU(inplace=True),", "            nn.Conv2d(32, 64, 3, padding=1), nn.ReLU(inplace=True), nn.MaxPool2d(2),", "            nn.Conv2d(64, 128, 3, padding=1), nn.ReLU(inplace=True), nn.MaxPool2d(2),", "            nn.Conv2d(128, 128, 3, padding=1), nn.ReLU(inplace=True),", "            nn.AdaptiveAvgPool2d(1),", "        )", "        self.head = nn.Linear(128, n_classes)", "", "    def forward(self, x):", "        return self.head(self.net(x).flatten(1))", "", "", "class SEBlock(nn.Module):", "    def __init__(self, ch: int, reduction: int = 8):", "        super().__init__()", "        mid = max(8, ch // reduction)", "        self.fc1 = nn.Linear(ch, mid)", "        self.fc2 = nn.Linear(mid, ch)", "", "    def forward(self, x):", "        b, c, _, _ = x.shape", "        s = x.mean(dim=(2, 3))", "        s = torch.sigmoid(self.fc2(F.relu(self.fc1(s), inplace=True))).view(b, c, 1, 1)", "        return x * s", "", "", "class ResBlock(nn.Module):", "    def __init__(self, in_ch: int, out_ch: int, stride: int = 1, use_se: bool = False):", "        super().__init__()", "        self.conv1 = nn.Conv2d(in_ch, out_ch, 3, stride=stride, padding=1, bias=False)", "        self.bn1 = nn.BatchNorm2d(out_ch)", "        self.conv2 = nn.Conv2d(out_ch, out_ch, 3, stride=1, padding=1, bias=False)", "        self.bn2 = nn.BatchNorm2d(out_ch)", "        self.se = SEBlock(out_ch) if use_se else nn.Identity()", "        self.skip = (", "            nn.Sequential(nn.Conv2d(in_ch, out_ch, 1, stride=stride, bias=False), nn.BatchNorm2d(out_ch))", "            if (stride != 1 or in_ch != out_ch)", "            else nn.Identity()", "        )", "", "    def forward(self, x):", "        h = F.relu(self.bn1(self.conv1(x)), inplace=True)", "        h = self.se(self.bn2(self.conv2(h)))", "        return F.relu(h + self.skip(x), inplace=True)", "", "", "class SmallResNet(nn.Module):", "    \"\"\"3-stage CIFAR ResNet-14 (6 residual blocks, width 32-64-128, ~560k params) with optional SE attention.\"\"\"", "    def __init__(self, in_ch: int, use_se: bool = False, n_classes: int = 10):", "        super().__init__()", "        self.stem = nn.Sequential(nn.Conv2d(in_ch, 32, 3, padding=1, bias=False), nn.BatchNorm2d(32), nn.ReLU(inplace=True))", "        self.s1 = nn.Sequential(ResBlock(32, 32, 1, use_se), ResBlock(32, 32, 1, use_se))", "        self.s2 = nn.Sequential(ResBlock(32, 64, 2, use_se), ResBlock(64, 64, 1, use_se))", "        self.s3 = nn.Sequential(ResBlock(64, 128, 2, use_se), ResBlock(128, 128, 1, use_se))", "        self.pool = nn.AdaptiveAvgPool2d(1)", "        self.head = nn.Linear(128, n_classes)", "", "    def forward(self, x):", "        h = self.s3(self.s2(self.s1(self.stem(x))))", "        return self.head(self.pool(h).flatten(1))", "", "", "def augment_batch_gpu(x: torch.Tensor, aug: bool, cutout: int) -> torch.Tensor:", "    \"\"\"Fast vectorized per-sample RandomHorizontalFlip, RandomCrop(pad=4), and Cutout on GPU.\"\"\"", "    if aug:", "        b, _, h, w = x.shape", "        flip = torch.rand(b, 1, 1, 1, device=x.device) < 0.5", "        x = torch.where(flip, x.flip(-1), x)", "        pad = 4", "        xp = F.pad(x, (pad, pad, pad, pad), mode=\"constant\", value=0.0).permute(0, 2, 3, 1)", "        dy = torch.randint(0, 2 * pad + 1, (b,), device=x.device)", "        dx = torch.randint(0, 2 * pad + 1, (b,), device=x.device)", "        rows = dy[:, None] + torch.arange(h, device=x.device)[None, :]", "        cols = dx[:, None] + torch.arange(w, device=x.device)[None, :]", "        b_idx = torch.arange(b, device=x.device)[:, None, None]", "        x = xp[b_idx, rows[:, :, None], cols[:, None, :]].permute(0, 3, 1, 2).contiguous()", "    if cutout > 0:", "        b, _, h, w = x.shape", "        cy = torch.randint(0, h, (b,), device=x.device)", "        cx = torch.randint(0, w, (b,), device=x.device)", "        half = cutout // 2", "        yy = torch.arange(h, device=x.device)[None, :]", "        xx = torch.arange(w, device=x.device)[None, :]", "        mask_y = (yy >= (cy[:, None] - half)) & (yy < (cy[:, None] + half))", "        mask_x = (xx >= (cx[:, None] - half)) & (xx < (cx[:, None] + half))", "        mask = ~(mask_y[:, :, None] & mask_x[:, None, :])", "        x = x * mask[:, None, :, :].to(x.dtype)", "    return x", "", "", "def load_normalized_tensors(ds_name: str, data_root: Path):", "    \"\"\"Preload and normalize entire dataset ONCE in RAM to eliminate PIL/DataLoader bottlenecks.\"\"\"", "    dspec = DATASET_SPECS[ds_name]", "    mean = torch.tensor(dspec[\"mean\"], dtype=torch.float32).view(1, -1, 1, 1)", "    std = torch.tensor(dspec[\"std\"], dtype=torch.float32).view(1, -1, 1, 1)", "    if ds_name == \"cifar10\":", "        raw_tr = datasets.CIFAR10(str(data_root / \"veriloop_cifar10_data\"), train=True, download=True)", "        raw_te = datasets.CIFAR10(str(data_root / \"veriloop_cifar10_data\"), train=False, download=True)", "        x_tr = torch.from_numpy(raw_tr.data).permute(0, 3, 1, 2).float().div_(255.0).sub_(mean).div_(std)", "        y_tr = torch.tensor(raw_tr.targets, dtype=torch.long)", "        x_te = torch.from_numpy(raw_te.data).permute(0, 3, 1, 2).float().div_(255.0).sub_(mean).div_(std)", "        y_te = torch.tensor(raw_te.targets, dtype=torch.long)", "    else:", "        raw_tr = datasets.FashionMNIST(str(data_root / \"veriloop_fmnist_data\"), train=True, download=True)", "        raw_te = datasets.FashionMNIST(str(data_root / \"veriloop_fmnist_data\"), train=False, download=True)", "        x_tr = raw_tr.data.unsqueeze(1).float().div_(255.0).sub_(mean).div_(std)", "        y_tr = raw_tr.targets.clone().long()", "        x_te = raw_te.data.unsqueeze(1).float().div_(255.0).sub_(mean).div_(std)", "        y_te = raw_te.targets.clone().long()", "", "    # Fixed train/val split shared across all methods & seeds (strictly no test leakage)", "    perm = torch.randperm(len(y_tr), generator=torch.Generator().manual_seed(0))", "    val_n = dspec[\"val_n\"]", "    tr_idx, val_idx = perm[:-val_n], perm[-val_n:]", "    return (x_tr[tr_idx], y_tr[tr_idx]), (x_tr[val_idx], y_tr[val_idx]), (x_te, y_te)", "", "", "# ==================== CALIBRATION METRICS (ECE, BRIER, TEMP SCALING) ====================", "", "@torch.no_grad()", "def collect_logits(model: nn.Module, x_all: torch.Tensor, y_all: torch.Tensor, device: torch.device, bs: int = 512) -> tuple[torch.Tensor, torch.Tensor]:", "    model.eval()", "    all_logits = []", "    for i in range(0, len(y_all), bs):", "        xb = x_all[i : i + bs].to(device, non_blocking=True)", "        with torch.amp.autocast(\"cuda\", enabled=(device.type == \"cuda\")):", "            logits = model(xb)", "        all_logits.append(logits.float().cpu())", "    return torch.cat(all_logits, dim=0), y_all.cpu()", "", "", "def compute_metrics_from_logits(logits: torch.Tensor, targets: torch.Tensor, n_bins: int = 15) -> dict:", "    probs = F.softmax(logits, dim=1)", "    nll = F.cross_entropy(logits, targets).item()", "    confs, preds = probs.max(dim=1)", "    accs = (preds == targets).float()", "    acc = accs.mean().item()", "", "    # 15-bin Expected Calibration Error (Guo et al., 2017)", "    ece = 0.0", "    boundaries = torch.linspace(0.0, 1.0, n_bins + 1)", "    for lo, hi in zip(boundaries[:-1], boundaries[1:]):", "        mask = (confs > lo) & (confs <= hi) if lo > 0 else (confs >= lo) & (confs <= hi)", "        if mask.any():", "            ece += mask.float().mean().item() * abs(accs[mask].mean().item() - confs[mask].mean().item())", "", "    # Multiclass Brier score", "    one_hot = F.one_hot(targets, num_classes=logits.size(1)).float()", "    brier = ((probs - one_hot) ** 2).sum(dim=1).mean().item()", "    return {\"acc\": acc, \"nll\": nll, \"ece\": ece, \"brier\": brier}", "", "", "def fit_temperature_on_val(val_logits: torch.Tensor, val_targets: torch.Tensor) -> float:", "    \"\"\"Strictly validation-only post-hoc Temperature Scaling (Guo et al., 2017).\"\"\"", "    log_t = torch.zeros(1, requires_grad=True)", "    opt = torch.optim.LBFGS([log_t], lr=0.1, max_iter=50)", "", "    def closure():", "        opt.zero_grad()", "        t = torch.exp(log_t).clamp(0.1, 10.0)", "        loss = F.cross_entropy(val_logits / t, val_targets)", "        loss.backward()", "        return loss", "", "    opt.step(closure)", "    return float(torch.exp(log_t).clamp(0.1, 10.0).item())", "", "", "# ==================== EXPERIMENT CONFIGS ====================", "", "METHOD_SPECS = {", "    \"M0_Linear\":            {\"arch\": \"linear\", \"aug\": False, \"opt\": \"adamw\", \"lr\": 2e-3, \"wd\": 1e-4, \"cos\": False, \"ls\": 0.0, \"mixup\": 0.0, \"cutout\": 0, \"se\": False},", "    \"M1_PlainCNN\":          {\"arch\": \"plain\",  \"aug\": False, \"opt\": \"adamw\", \"lr\": 1e-3, \"wd\": 0.0,  \"cos\": False, \"ls\": 0.0, \"mixup\": 0.0, \"cutout\": 0, \"se\": False},", "    \"M2_ResNet_Base\":       {\"arch\": \"resnet\", \"aug\": False, \"opt\": \"adamw\", \"lr\": 1e-3, \"wd\": 0.0,  \"cos\": False, \"ls\": 0.0, \"mixup\": 0.0, \"cutout\": 0, \"se\": False},", "    \"M3_ResNet_Aug\":        {\"arch\": \"resnet\", \"aug\": True,  \"opt\": \"adamw\", \"lr\": 1e-3, \"wd\": 1e-4, \"cos\": False, \"ls\": 0.0, \"mixup\": 0.0, \"cutout\": 0, \"se\": False},", "    \"M4_ResNet_Aug_Cosine\": {\"arch\": \"resnet\", \"aug\": True,  \"opt\": \"sgd\",   \"lr\": 0.1,  \"wd\": 5e-4, \"cos\": True,  \"ls\": 0.0, \"mixup\": 0.0, \"cutout\": 0, \"se\": False},", "    \"M5_ResNet_LS\":         {\"arch\": \"resnet\", \"aug\": True,  \"opt\": \"sgd\",   \"lr\": 0.1,  \"wd\": 5e-4, \"cos\": True,  \"ls\": 0.1, \"mixup\": 0.0, \"cutout\": 0, \"se\": False},", "    \"M6_ResNet_Mixup\":      {\"arch\": \"resnet\", \"aug\": True,  \"opt\": \"sgd\",   \"lr\": 0.1,  \"wd\": 5e-4, \"cos\": True,  \"ls\": 0.0, \"mixup\": 0.4, \"cutout\": 0, \"se\": False},", "    \"M7_SEResNet_Full\":     {\"arch\": \"resnet\", \"aug\": True,  \"opt\": \"sgd\",   \"lr\": 0.1,  \"wd\": 5e-4, \"cos\": True,  \"ls\": 0.05,\"mixup\": 0.0, \"cutout\": 8, \"se\": True},", "}", "", "DATASET_SPECS = {", "    \"cifar10\": {", "        \"in_ch\": 3, \"img_size\": 32, \"val_n\": 5000, \"epochs\": 30,", "        \"mean\": (0.4914, 0.4822, 0.4465), \"std\": (0.2470, 0.2435, 0.2616),", "        \"methods\": [", "            \"M0_Linear\", \"M1_PlainCNN\", \"M2_ResNet_Base\", \"M3_ResNet_Aug\",", "            \"M4_ResNet_Aug_Cosine\", \"M5_ResNet_LS\", \"M6_ResNet_Mixup\", \"M7_SEResNet_Full\",", "        ],", "    },", "    \"fmnist\": {", "        \"in_ch\": 1, \"img_size\": 28, \"val_n\": 10000, \"epochs\": 15,", "        \"mean\": (0.2860,), \"std\": (0.3530,),", "        \"methods\": [", "            \"M0_Linear\", \"M1_PlainCNN\", \"M2_ResNet_Base\",", "            \"M4_ResNet_Aug_Cosine\", \"M5_ResNet_LS\", \"M7_SEResNet_Full\",", "        ],", "    },", "}", "", "", "def build_model(spec: dict, in_ch: int, img_size: int) -> nn.Module:", "    if spec[\"arch\"] == \"linear\":", "        return LinearBaseline(in_ch, img_size)", "    if spec[\"arch\"] == \"plain\":", "        return PlainCNN(in_ch)", "    return SmallResNet(in_ch, use_se=spec[\"se\"])", "", "", "def run_single(ds_name: str, method: str, seed: int, epochs: int, batch_size: int, splits, device: torch.device, ws: Path) -> dict:", "    dspec = DATASET_SPECS[ds_name]", "    mspec = METHOD_SPECS[method]", "    seed_everything(seed)", "", "    (x_tr, y_tr), (x_val, y_val), (x_te, y_te) = splits", "    n_tr = len(y_tr)", "    gen = torch.Generator().manual_seed(seed)", "", "    model = build_model(mspec, dspec[\"in_ch\"], dspec[\"img_size\"]).to(device)", "    n_params = sum(p.numel() for p in model.parameters())", "", "    if mspec[\"opt\"] == \"sgd\":", "        opt = torch.optim.SGD(model.parameters(), lr=mspec[\"lr\"], momentum=0.9, nesterov=True, weight_decay=mspec[\"wd\"])", "    else:", "        opt = torch.optim.AdamW(model.parameters(), lr=mspec[\"lr\"], weight_decay=mspec[\"wd\"])", "", "    warmup_ep = 3 if (mspec[\"cos\"] and epochs >= 10) else 0", "    if mspec[\"cos\"]:", "        def lr_lambda(ep):", "            if warmup_ep > 0 and ep < warmup_ep:", "                return float(ep + 1) / float(warmup_ep)", "            prog = (ep - warmup_ep) / max(1, epochs - warmup_ep)", "            return 0.5 * (1.0 + math.cos(math.pi * prog))", "        sched = torch.optim.lr_scheduler.LambdaLR(opt, lr_lambda)", "    else:", "        sched = None", "", "    scaler = torch.amp.GradScaler(\"cuda\", enabled=(device.type == \"cuda\"))", "    if device.type == \"cuda\":", "        torch.cuda.reset_peak_memory_stats(device)", "", "    best_val_acc = -1.0", "    best_epoch = 0", "    best_state = None", "    history = []", "    tb_records = []", "    t0 = time.time()", "", "    for ep in range(1, epochs + 1):", "        model.train()", "        tr_loss_sum = 0.0", "        tr_n = 0", "        perm_ep = torch.randperm(n_tr, generator=gen)", "        for i in range(0, n_tr, batch_size):", "            idx_b = perm_ep[i : i + batch_size]", "            xb = x_tr[idx_b].to(device, non_blocking=True)", "            yb = y_tr[idx_b].to(device, non_blocking=True)", "            if mspec[\"aug\"] or mspec[\"cutout\"] > 0:", "                xb = augment_batch_gpu(xb, mspec[\"aug\"], mspec[\"cutout\"])", "            opt.zero_grad(set_to_none=True)", "            with torch.amp.autocast(\"cuda\", enabled=(device.type == \"cuda\")):", "                if mspec[\"mixup\"] > 0.0:", "                    lam = torch.distributions.Beta(mspec[\"mixup\"], mspec[\"mixup\"]).sample().item()", "                    perm_b = torch.randperm(xb.size(0), device=device)", "                    xm = lam * xb + (1.0 - lam) * xb[perm_b]", "                    logits = model(xm)", "                    loss = lam * F.cross_entropy(logits, yb, label_smoothing=mspec[\"ls\"]) + (1.0 - lam) * F.cross_entropy(logits, yb[perm_b], label_smoothing=mspec[\"ls\"])", "                else:", "                    logits = model(xb)", "                    loss = F.cross_entropy(logits, yb, label_smoothing=mspec[\"ls\"])", "            scaler.scale(loss).backward()", "            scaler.step(opt)", "            scaler.update()", "            tr_loss_sum += loss.item() * yb.size(0)", "            tr_n += yb.size(0)", "        if sched is not None:", "            sched.step()", "", "        tr_loss = tr_loss_sum / tr_n", "        v_logits, v_targets = collect_logits(model, x_val, y_val, device)", "        vm = compute_metrics_from_logits(v_logits, v_targets)", "        if vm[\"acc\"] > best_val_acc:", "            best_val_acc = vm[\"acc\"]", "            best_epoch = ep", "            best_state = {k: v.detach().cpu().clone() for k, v in model.state_dict().items()}", "", "        row = {", "            \"dataset\": ds_name, \"method\": method, \"seed\": seed, \"epoch\": ep,", "            \"train_loss\": round(tr_loss, 6),", "            \"val_acc\": round(vm[\"acc\"], 6), \"val_nll\": round(vm[\"nll\"], 6), \"val_ece\": round(vm[\"ece\"], 6),", "        }", "        history.append(row)", "        tb_records.extend([", "            (ep, \"val_acc\", vm[\"acc\"]), (ep, \"val_nll\", vm[\"nll\"]),", "            (ep, \"val_ece\", vm[\"ece\"]), (ep, \"train_loss\", tr_loss),", "        ])", "", "    # Validation-selected checkpoint: fit temperature T* on val, score held-out test ONCE", "    model.load_state_dict(best_state)", "    v_logits, v_targets = collect_logits(model, x_val, y_val, device)", "    t_star = fit_temperature_on_val(v_logits, v_targets)", "", "    te_logits, te_targets = collect_logits(model, x_te, y_te, device)", "    raw_tm = compute_metrics_from_logits(te_logits, te_targets)", "    cal_tm = compute_metrics_from_logits(te_logits / t_star, te_targets)", "    elapsed = time.time() - t0", "    peak_mb = (torch.cuda.max_memory_allocated(device) / (1024 * 1024)) if device.type == \"cuda\" else 0.0", "", "    tb_records.extend([", "        (epochs, \"test_acc\", raw_tm[\"acc\"]), (epochs, \"test_nll\", raw_tm[\"nll\"]),", "        (epochs, \"test_ece\", raw_tm[\"ece\"]), (epochs, \"cal_nll\", cal_tm[\"nll\"]),", "        (epochs, \"cal_ece\", cal_tm[\"ece\"]),", "    ])", "", "    # 1. Write TensorBoard binary tfevents", "    tb_p = ws / \"runs/tb\" / ds_name / f\"{method}_s{seed}\" / f\"events.out.tfevents.{ds_name}.{method}.s{seed}\"", "    pb.write_tfevents_scalars(tb_p, tb_records)", "", "    # 2. Write W&B local run artifacts", "    wb_dir = ws / \"runs/wandb\" / ds_name / f\"{method}_s{seed}\" / \"files\"", "    wb_dir.mkdir(parents=True, exist_ok=True)", "    (wb_dir / \"config.json\").write_text(json.dumps({", "        \"dataset\": ds_name, \"method\": method, \"seed\": seed, \"epochs\": epochs,", "        \"batch_size\": batch_size, \"n_params\": n_params, \"selected_on\": \"val_acc\",", "        \"temp_scaling_fit_on\": \"val_logits\", **mspec,", "    }, indent=2), encoding=\"utf-8\")", "    (wb_dir / \"wandb-history.jsonl\").write_text(\"\\n\".join(json.dumps(r) for r in history) + \"\\n\", encoding=\"utf-8\")", "", "    rec = {", "        \"timestamp_utc\": datetime.now(timezone.utc).isoformat(),", "        \"dataset\": ds_name,", "        \"method\": method,", "        \"seed\": seed,", "        \"epochs\": epochs,", "        \"n_params\": n_params,", "        \"best_val_epoch\": best_epoch,", "        \"val_acc\": round(best_val_acc, 6),", "        \"test_acc\": round(raw_tm[\"acc\"], 6),", "        \"test_nll\": round(raw_tm[\"nll\"], 6),", "        \"test_ece\": round(raw_tm[\"ece\"], 6),", "        \"test_brier\": round(raw_tm[\"brier\"], 6),", "        \"temp_T\": round(t_star, 4),", "        \"cal_nll\": round(cal_tm[\"nll\"], 6),", "        \"cal_ece\": round(cal_tm[\"ece\"], 6),", "        \"cal_brier\": round(cal_tm[\"brier\"], 6),", "        \"wall_time_s\": round(elapsed, 2),", "        \"peak_vram_mb\": round(peak_mb, 1),", "        \"device\": torch.cuda.get_device_name(0) if device.type == \"cuda\" else \"CPU\",", "        \"torch_version\": torch.__version__,", "    }", "    (wb_dir / \"wandb-summary.json\").write_text(json.dumps({**rec, \"_step\": epochs}, indent=2), encoding=\"utf-8\")", "", "    # 3. Write CSV epoch log", "    csv_p = ws / \"runs/csv\" / ds_name / f\"{method}_s{seed}.csv\"", "    csv_p.parent.mkdir(parents=True, exist_ok=True)", "    with csv_p.open(\"w\", encoding=\"utf-8\", newline=\"\") as fh:", "        w = csv.DictWriter(fh, fieldnames=[\"dataset\", \"method\", \"seed\", \"epoch\", \"train_loss\", \"val_acc\", \"val_nll\", \"val_ece\"])", "        w.writeheader()", "        w.writerows(history)", "", "    return rec", "", "", "def update_research_wiki_and_audit(ws: Path, ledger_path: Path, completed_stage: str):", "    \"\"\"Update persistent Research Wiki and run deterministic VeriLoop Layer-1 gates on it.\"\"\"", "    rows = [json.loads(l) for l in ledger_path.read_text(encoding=\"utf-8\").splitlines() if l.strip()]", "    by_dm = defaultdict(list)", "    for r in rows:", "        by_dm[(r[\"dataset\"], r[\"method\"])].append(r)", "", "    now_utc = datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\")", "    ledger_sha = sha256_file(ledger_path)[:16]", "    # Write canonical plain-text log from ledger for deterministic tracing", "    log_lines = [", "        \"# VeriLoop Overnight GPU Trajectory Canonical Log\",", "        f\"# updated_utc={now_utc} completed_runs={len(rows)} ledger_sha256={ledger_sha}\",", "    ]", "    wiki_lines = [", "        \"# VeriLoop Persistent Research Wiki — Overnight Real-GPU Calibration Study\",", "        \"\",", "        f\"- **Last Updated (UTC):** `{now_utc}`\",", "        f\"- **Completed GPU Runs:** `{len(rows)}` (Latest stage: `{completed_stage}`)\",", "        f\"- **Ledger SHA-256:** `{ledger_sha}`\",", "        \"\",", "        \"## Live Multi-Seed Results (`out/wiki_metrics.log`)\",", "        \"\",", "        \"| Dataset | Method | Seeds | Val Acc | Test Acc | Raw ECE | Cal ECE ($T^*$) | Raw NLL | Cal NLL | Mean $T^*$ |\",", "        \"|---|---|---:|---:|---:|---:|---:|---:|---:|---:|\",", "    ]", "    for (ds, meth), items in sorted(by_dm.items()):", "        n = len(items)", "        def _ms(k):", "            vs = [x[k] for x in items]", "            return statistics.mean(vs), (statistics.stdev(vs) if len(vs) > 1 else 0.0)", "        va_m, va_s = _ms(\"val_acc\")", "        ta_m, ta_s = _ms(\"test_acc\")", "        re_m, re_s = _ms(\"test_ece\")", "        ce_m, ce_s = _ms(\"cal_ece\")", "        rn_m, rn_s = _ms(\"test_nll\")", "        cn_m, cn_s = _ms(\"cal_nll\")", "        t_m, _ = _ms(\"temp_T\")", "        log_lines.append(", "            f\"STAGE {ds:7s} {meth:20s} n={n} | val_acc={va_m:.4f}±{va_s:.4f} test_acc={ta_m:.4f}±{ta_s:.4f} \"", "            f\"raw_ece={re_m:.4f}±{re_s:.4f} cal_ece={ce_m:.4f}±{ce_s:.4f} \"", "            f\"raw_nll={rn_m:.4f}±{rn_s:.4f} cal_nll={cn_m:.4f}±{cn_s:.4f} T={t_m:.4f}\"", "        )", "        wiki_lines.append(", "            f\"| `{ds}` | `{meth}` | {n} | {va_m:.4f}±{va_s:.4f} | {ta_m:.4f}±{ta_s:.4f} | \"", "            f\"{re_m:.4f}±{re_s:.4f} | {ce_m:.4f}±{ce_s:.4f} | {rn_m:.4f}±{rn_s:.4f} | {cn_m:.4f}±{cn_s:.4f} | {t_m:.4f} |\"", "        )", "    log_lines.append(\"COMPLETED_OK\")", "    wiki_log = ws / \"out/wiki_metrics.log\"", "    wiki_log.write_text(\"\\n\".join(log_lines) + \"\\n\", encoding=\"utf-8\")", "", "    wiki_p = ws / \"wiki/RESEARCH_WIKI.md\"", "    wiki_p.parent.mkdir(parents=True, exist_ok=True)", "    wiki_p.write_text(\"\\n\".join(wiki_lines) + \"\\n\", encoding=\"utf-8\")", "", "    # Run deterministic Layer-1 gates (trace_numbers + audit_code) at this checkpoint!", "    t0 = time.time()", "    p_tr = subprocess.run(", "        [sys.executable, str(RL_SCRIPTS / \"trace_numbers.py\"), str(wiki_p), \"--logs\", str(wiki_log), \"--json\"],", "        capture_output=True, text=True,", "    )", "    p_ast = subprocess.run(", "        [sys.executable, str(RL_SCRIPTS / \"audit_code.py\"), \"--scripts\", str(Path(__file__).resolve().parent), \"--report\", str(wiki_p), \"--json\", \"--strict\"],", "        capture_output=True, text=True,", "    )", "    gate_ms = round((time.time() - t0) * 1000.0, 1)", "    tr_d = json.loads(p_tr.stdout) if p_tr.stdout.strip().startswith(\"{\") else {}", "    ast_d = json.loads(p_ast.stdout) if p_ast.stdout.strip().startswith(\"{\") else {}", "    gate_rec = {", "        \"timestamp_utc\": datetime.now(timezone.utc).isoformat(),", "        \"stage\": completed_stage,", "        \"completed_runs\": len(rows),", "        \"gate_elapsed_ms\": gate_ms,", "        \"trace_rc\": p_tr.returncode,", "        \"traced\": tr_d.get(\"traced\", 0),", "        \"untraced\": len(tr_d.get(\"untraced\", [])),", "        \"sign_mismatches\": len(tr_d.get(\"sign_mismatches\", [])),", "        \"ast_rc\": p_ast.returncode,", "        \"ast_high\": int((ast_d.get(\"counts\") or {}).get(\"HIGH\", 0)),", "        \"passed\": (p_tr.returncode == 0 and p_ast.returncode == 0),", "    }", "    with (ws / \"out/gate_audit_trace.jsonl\").open(\"a\", encoding=\"utf-8\") as fh:", "        fh.write(json.dumps(gate_rec) + \"\\n\")", "    print(", "        f\"  [VERILOOP_STAGE_GATE] stage={completed_stage} passed={gate_rec['passed']} \"", "        f\"traced={gate_rec['traced']} untraced={gate_rec['untraced']} ast_high={gate_rec['ast_high']} ({gate_ms}ms)\",", "        flush=True,", "    )", "", "", "def main():", "    ap = argparse.ArgumentParser(description=\"Crash-resumable multi-dataset GPU overnight research suite.\")", "    ap.add_argument(\"--ws\", default=str(Path(__file__).resolve().parents[1]))", "    ap.add_argument(\"--data-root\", default=\"/tmp\")", "    ap.add_argument(\"--datasets\", nargs=\"+\", choices=(\"cifar10\", \"fmnist\"), default=[\"cifar10\", \"fmnist\"])", "    ap.add_argument(\"--seeds\", type=int, nargs=\"+\", default=[42, 43, 44])", "    ap.add_argument(\"--batch-size\", type=int, default=256)", "    ap.add_argument(\"--epochs-override\", type=int, default=0, help=\"Optional override for smoke testing\")", "    ap.add_argument(\"--resume\", action=\"store_true\", help=\"Skip (dataset, method, seed) already in trajectory_ledger.jsonl\")", "    args = ap.parse_args()", "", "    ws = Path(args.ws).resolve()", "    (ws / \"out\").mkdir(parents=True, exist_ok=True)", "    ledger_path = ws / \"out/trajectory_ledger.jsonl\"", "", "    done_keys = set()", "    if args.resume and ledger_path.is_file():", "        for line in ledger_path.read_text(encoding=\"utf-8\").splitlines():", "            if line.strip():", "                r = json.loads(line)", "                done_keys.add((r[\"dataset\"], r[\"method\"], int(r[\"seed\"])))", "", "    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")", "    gpu_name = torch.cuda.get_device_name(0) if device.type == \"cuda\" else \"CPU\"", "    print(f\"OVERNIGHT_GPU_STUDY START | device={device} ({gpu_name}) | torch={torch.__version__} | resumed={len(done_keys)}\", flush=True)", "", "    total_runs = sum(len(DATASET_SPECS[d][\"methods\"]) * len(args.seeds) for d in args.datasets)", "    idx = 0", "    for ds_name in args.datasets:", "        dspec = DATASET_SPECS[ds_name]", "        epochs = args.epochs_override if args.epochs_override > 0 else dspec[\"epochs\"]", "        splits = load_normalized_tensors(ds_name, Path(args.data_root))", "        for method in dspec[\"methods\"]:", "            stage_ran = False", "            for seed in args.seeds:", "                idx += 1", "                if (ds_name, method, seed) in done_keys:", "                    print(f\"[{idx}/{total_runs}] SKIP (resumed) {ds_name}/{method}/s{seed}\", flush=True)", "                    continue", "                rec = run_single(ds_name, method, seed, epochs, args.batch_size, splits, device, ws)", "                with ledger_path.open(\"a\", encoding=\"utf-8\") as fh:", "                    fh.write(json.dumps(rec) + \"\\n\")", "                    fh.flush()", "                stage_ran = True", "                print(", "                    f\"[{idx}/{total_runs}] {ds_name:7s} {method:20s} s={seed} | \"", "                    f\"val={rec['val_acc']:.4f} test={rec['test_acc']:.4f} \"", "                    f\"raw_ece={rec['test_ece']:.4f} -> cal_ece={rec['cal_ece']:.4f} (T={rec['temp_T']:.2f}) | \"", "                    f\"{rec['wall_time_s']:.1f}s {rec['peak_vram_mb']:.0f}MB\",", "                    flush=True,", "                )", "            if stage_ran or not (ws / \"wiki/RESEARCH_WIKI.md\").is_file():", "                update_research_wiki_and_audit(ws, ledger_path, f\"{ds_name}::{method}\")", "", "    print(f\"OVERNIGHT_GPU_STUDY COMPLETE | total_planned={total_runs} | ledger={ledger_path}\", flush=True)", "", "", "if __name__ == \"__main__\":", "    main()"]}}};
let currentFilter = 'all';
let currentTab = 'logs';
let currentFile = Object.keys(BUNDLE.logs)[0] || '';
let highlightLine = 0;

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const linksByLine = {};
for (const nl of BUNDLE.number_links) {
  (linksByLine[nl.line] ||= []).push(nl);
}
const citesByLine = {};
for (const cp of (BUNDLE.citations.pairs || [])) {
  (citesByLine[cp.line] ||= []).push(cp);
}

function setFilter(f) {
  currentFilter = f;
  for (const id of ['all','def','num']) document.getElementById('flt-'+id).classList.remove('active');
  document.getElementById(f==='all'?'flt-all':f==='defects'?'flt-def':'flt-num').classList.add('active');
  renderManuscript();
}

function decorateLine(ln, rawText) {
  let out = esc(rawText);
  const nls = linksByLine[ln] || [];
  const used = new Set();
  for (const nl of nls) {
    if (used.has(nl.token)) continue;
    used.add(nl.token);
    const cls = nl.status === 'TRACED' ? 'tok-traced' : (nl.status === 'SIGN_MISMATCH' ? 'tok-sign' : 'tok-untraced');
    const tip = nl.status + (nl.all_sources.length ? ' -> ' + nl.all_sources.join(', ') : '');
    const idx = BUNDLE.number_links.indexOf(nl);
    const re = new RegExp('(?<![\w.])' + nl.token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    out = out.replace(re, `<span class="tok ${cls}" title="${esc(tip)}" onclick="jumpNumber(${idx})">${esc(nl.token)}</span>`);
  }
  const cps = citesByLine[ln] || [];
  for (const cp of cps) {
    const isErr = ['MISSING_BIB','UNRESOLVED_REFERENCE','TITLE_MISMATCH','AUTHOR_MISMATCH','YEAR_MISMATCH','RETRACTED_PAPER','UNRESOLVED_ARXIV'].includes(cp.status);
    const cls = isErr ? 'tok-cite-err' : 'tok-cite';
    const cidx = BUNDLE.citations.pairs.indexOf(cp);
    const safeKey = esc(cp.key);
    out = out.replace(safeKey, `<span class="tok ${cls}" title="${esc(cp.status)}" onclick="jumpCite(${cidx})">${safeKey}</span>`);
  }
  return out;
}

function renderManuscript() {
  const q = (document.getElementById('ms-search').value || '').toLowerCase();
  const el = document.getElementById('ms-view');
  const rows = [];
  BUNDLE.report_lines.forEach((line, i) => {
    const ln = i + 1;
    const nls = linksByLine[ln] || [];
    const cps = citesByLine[ln] || [];
    const hasDef = nls.some(x => x.status !== 'TRACED') || cps.some(x => x.status.includes('MISSING') || x.status.includes('MISMATCH') || x.status.includes('UNRESOLVED'));
    if (currentFilter === 'defects' && !hasDef) return;
    if (currentFilter === 'numbers' && !nls.length && !cps.length) return;
    if (q && !line.toLowerCase().includes(q)) return;
    rows.push(`<div class="code-line" id="ms-L${ln}"><span class="ln">${ln}</span><span class="txt">${decorateLine(ln, line)}</span></div>`);
  });
  el.innerHTML = rows.join('') || '<div class="card">No matching lines under current filter.</div>';
}

function showBanner(msg) {
  const b = document.getElementById('banner');
  b.style.display = msg ? 'block' : 'none';
  b.innerHTML = msg;
}

function jumpNumber(idx) {
  const nl = BUNDLE.number_links[idx];
  if (!nl) return;
  if (nl.target_file && BUNDLE.logs[nl.target_file]) {
    currentTab = 'logs';
    currentFile = nl.target_file;
    highlightLine = nl.target_line;
    updateTabs();
    showBanner(`<b>${esc(nl.token)}</b> [${esc(nl.status)}] &rarr; <code>${esc(BUNDLE.logs[nl.target_file].name)}:${nl.target_line}</code>`);
    renderRight();
  } else {
    currentTab = 'logs';
    updateTabs();
    showBanner(`<b>${esc(nl.token)}</b> [${esc(nl.status)}] — No matching log entry found in indexed logs.`);
    renderRight();
  }
}

function jumpCite(cidx) {
  const cp = BUNDLE.citations.pairs[cidx];
  currentTab = 'cites';
  updateTabs();
  showBanner(`Citation <b>${esc(cp.key)}</b> (L${cp.line}) — Status: <b>${esc(cp.status)}</b>`);
  renderRight(cp.key);
}

function jumpCode(file, ln) {
  if (!BUNDLE.code[file]) return;
  currentTab = 'code';
  currentFile = file;
  highlightLine = ln;
  updateTabs();
  showBanner(`AST Finding &rarr; <code>${esc(BUNDLE.code[file].name)}:${ln}</code>`);
  renderRight();
}

function switchTab(t) {
  currentTab = t;
  highlightLine = 0;
  showBanner('');
  if (t === 'logs' && !BUNDLE.logs[currentFile]) currentFile = Object.keys(BUNDLE.logs)[0] || '';
  if (t === 'code' && !BUNDLE.code[currentFile]) currentFile = Object.keys(BUNDLE.code)[0] || '';
  updateTabs();
  renderRight();
}

function updateTabs() {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === currentTab));
  const sel = document.getElementById('file-sel');
  if (currentTab === 'logs' || currentTab === 'code') {
    const map = currentTab === 'logs' ? BUNDLE.logs : BUNDLE.code;
    sel.style.display = 'inline-block';
    sel.innerHTML = Object.entries(map).map(([k, v]) => `<option value="${esc(k)}" ${k===currentFile?'selected':''}>${esc(v.name)} (${v.sha256.slice(0,8)})</option>`).join('');
  } else {
    sel.style.display = 'none';
  }
}

function renderRight(focusCiteKey) {
  const el = document.getElementById('right-view');
  const sel = document.getElementById('file-sel');
  if (currentTab === 'logs' || currentTab === 'code') {
    if (sel.value) currentFile = sel.value;
    const map = currentTab === 'logs' ? BUNDLE.logs : BUNDLE.code;
    const fobj = map[currentFile];
    let htmlParts = [];
    if (currentTab === 'code' && (BUNDLE.ast.findings || []).length) {
      htmlParts.push('<div class="card"><h4>Python AST Integrity Findings</h4>' +
        BUNDLE.ast.findings.map(f => {
          const pcls = f.severity === 'HIGH' ? 'pill-high' : 'pill-med';
          const fullPath = Object.keys(BUNDLE.code).find(k => k.endsWith(f.file)) || f.file;
          return `<div style="margin:4px 0;cursor:pointer" onclick="jumpCode('${esc(fullPath)}', ${f.line||1})"><span class="pill ${pcls}">${esc(f.severity)}</span><code>${esc(f.code)}</code> ${esc(f.file)}:${f.line} — ${esc(f.detail||'')}</div>`;
        }).join('') + '</div>');
    }
    if (!fobj) {
      htmlParts.push('<div class="card">No files loaded in this tab.</div>');
      el.innerHTML = htmlParts.join('');
      return;
    }
    htmlParts.push(fobj.lines.map((l, i) => {
      const ln = i + 1;
      const hl = ln === highlightLine ? ' hl-pulse' : '';
      return `<div class="code-line${hl}" id="r-L${ln}"><span class="ln">${ln}</span><span class="txt">${esc(l)}</span></div>`;
    }).join(''));
    el.innerHTML = htmlParts.join('');
    if (highlightLine > 0) {
      const target = document.getElementById('r-L' + highlightLine);
      if (target) target.scrollIntoView({behavior: 'smooth', block: 'center'});
    }
  } else if (currentTab === 'cites') {
    const pairs = BUNDLE.citations.pairs || [];
    const seen = new Map();
    for (const p of pairs) { if (!seen.has(p.key)) seen.set(p.key, p); }
    const items = Array.from(seen.values());
    if (focusCiteKey) items.sort((a,b) => (a.key===focusCiteKey?-1:b.key===focusCiteKey?1:0));
    el.innerHTML = items.map(p => {
      const isErr = ['MISSING_BIB','UNRESOLVED_REFERENCE','TITLE_MISMATCH','AUTHOR_MISMATCH','YEAR_MISMATCH','RETRACTED_PAPER'].includes(p.status);
      const pcls = isErr ? 'pill-high' : 'pill-ok';
      const meta = p.online || {};
      const cva = p.claim_vs_abstract ? `<div class="meta"><b>Claim vs Abstract:</b> ${esc(p.claim_vs_abstract.status)} (overlap=${p.claim_vs_abstract.overlap})</div>` : '';
      const absHtml = meta.abstract ? `<div class="abs"><b>Fetched Real Abstract (${esc(meta.source||'')}):</b> ${esc(meta.abstract.slice(0, 650))}</div>` : '';
      return `<div class="card" style="${p.key===focusCiteKey?'border-color:#38bdf8':''}">
        <h4><span class="pill ${pcls}">${esc(p.status)}</span>${esc(p.key)}</h4>
        <div class="meta"><b>Bib Title:</b> ${esc(p.bib_title || meta.title || '(none)')} | <b>Year:</b> ${esc(p.bib_year || meta.year || '-')}</div>
        <div class="meta"><b>Manuscript Context (L${p.line}):</b> ${esc(p.sentence)}</div>
        ${cva}${absHtml}
      </div>`;
    }).join('') || '<div class="card">No citations extracted.</div>';
  } else {
    const lintHtml = BUNDLE.lint_messages.length
      ? BUNDLE.lint_messages.map(m => `<div><code>${esc(m)}</code></div>`).join('')
      : '<span class="pill pill-ok">OK</span> 0 prose lint issues';
    const shaHtml = [
      ...BUNDLE.report_files.map(f => `<li><code>${esc(f.name)}</code> sha256=<code>${esc(f.sha256)}</code></li>`),
      ...Object.values(BUNDLE.logs).map(f => `<li><code>${esc(f.name)}</code> sha256=<code>${esc(f.sha256)}</code></li>`),
    ].join('');
    el.innerHTML = `<div class="card"><h4>Best-Paper Prose &amp; Figure Lint</h4>${lintHtml}</div>
      <div class="card"><h4>SHA-256 Artifact Provenance (${esc(BUNDLE.generated_utc)})</h4><ul>${shaHtml}</ul></div>`;
  }
}

updateTabs();
renderManuscript();
renderRight();
</script>
</body>
</html>
