const BUNDLE = {"generated_utc": "2026-11-26T23:50:39.093194+00:00", "report_files": [{"path": "/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/paper/gpu_showcase.tex", "name": "gpu_showcase.tex", "sha256": "e1af6417b50c122a"}, {"path": "/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/paper/bound/bound_table.tex", "name": "bound_table.tex", "sha256": "05b8278fb9e1331a"}], "report_lines": ["% ===== FILE: gpu_showcase.tex =====", "\\documentclass{article}", "\\usepackage{microtype}", "\\usepackage{graphicx}", "\\usepackage{booktabs}", "\\usepackage{amsmath,amssymb}", "\\usepackage{hyperref}", "\\usepackage[accepted]{icml2027}", "", "\\input{bound/bound_macros.tex}", "", "\\icmltitlerunning{VeriLoop Real GPU Deep Learning End-to-End Showcase}", "", "\\begin{document}", "", "\\twocolumn[", "\\icmltitle{Provenance-Bound Residual Regularization on Fashion-MNIST:\\\\An End-to-End Real-GPU Showcase of VeriLoop}", "", "\\begin{icmlauthorlist}", "\\icmlauthor{VeriLoop Reproducible Showcase}{vl}", "\\end{icmlauthorlist}", "\\icmlaffiliation{vl}{Generated end-to-end on NVIDIA GeForce RTX 3060 Ti via \\texttt{./veriloop gpu-showcase}}", "\\icmlcorrespondingauthor{VeriLoop Project}{https://github.com/shangliy/VeriLoop}", "\\vskip 0.3in", "]", "", "\\printAffiliationsAndNotice{}", "", "\\begin{abstract}", "This showcase demonstrates an end-to-end, provenance-bound deep learning research workflow executed on a real NVIDIA GeForce RTX 3060 Ti GPU (PyTorch 2.9.1+cu128) and compiled automatically through VeriLoop.", "We train four neural architectures across three independent random seeds (twelve GPU runs total) on Fashion-MNIST under strict validation-only checkpoint selection, logging every run simultaneously to binary TensorBoard event files, Weights \\& Biases local artifacts, and CSV logs.", "Using \\texttt{./veriloop bind}, all LaTeX macros, Booktabs tables, and Okabe-Ito vector figures are synthesized directly from raw execution logs with SHA-256 provenance manifests.", "Our regularized residual network (\\texttt{ResCNN\\_Full}) achieves \\vlRescnnFullTestAcc{} held-out test accuracy (95\\% CI \\vlRescnnFullTestAccCi{}), outperforming an unregularized residual ablation (\\vlRescnnNoregTestAcc{}), a two-layer MLP baseline (\\vlMlpBaselineTestAcc{}), and a non-residual ConvNet (\\vlPlaincnnTestAcc{}).", "Every decimal, AST check, and arXiv-verified citation passes \\texttt{./veriloop gate} with zero untraced numbers and exports an interactive split-pane Web review workbench (\\texttt{review\\_ui.html}).", "\\end{abstract}", "", "\\section{Introduction}", "Autonomous research workflows~\\citep{yang2026aris} increasingly execute multi-seed deep learning experiments and author conference manuscripts end to end, yet manual transcription between experiment trackers and LaTeX tables remains a primary source of silent numerical discrepancies.", "This self-contained showcase demonstrates how \\textbf{VeriLoop} eliminates transcription drift on real GPU deep learning workloads by binding TensorBoard and Weights \\& Biases logs directly to LaTeX macros, Booktabs tables, and vector figures via \\texttt{./veriloop bind}, verifying all references online against the arXiv API via \\texttt{./veriloop verify-cites}, enforcing deterministic hard gates via \\texttt{./veriloop gate}, and exporting an interactive split-pane audit UI via \\texttt{./veriloop review-ui}.", "", "We evaluate four architectures on \\textsc{Fashion-MNIST}~\\citep{xiao2017fashion} to isolate the empirical effect of residual skip connections~\\citep{he2015deep}, batch normalization~\\citep{ioffe2015batch}, label smoothing~\\citep{szegedy2015rethinking}, decoupled weight decay~\\citep{loshchilov2017decoupled}, and cosine learning-rate annealing~\\citep{loshchilov2016sgdr}.", "", "\\section{Experimental Protocol}", "\\paragraph{Dataset and strict split hygiene.}", "We use the official \\textsc{Fashion-MNIST} benchmark~\\citep{xiao2017fashion} (60,000 training images and 10,000 test images, $28\\times 28$ grayscale across 10 classes).", "Using a fixed permutation seed (seed~0), we partition the 60,000 training images into 50,000 training and 10,000 validation examples.", "Every model is trained for 8 epochs per seed across three independent random seeds (\\texttt{42}, \\texttt{43}, \\texttt{44}; batch size 256) on an NVIDIA GeForce RTX 3060 Ti GPU using AdamW~\\citep{loshchilov2017decoupled}.", "Model checkpoints are selected strictly by validation accuracy (\\texttt{val\\_acc}); the 10,000-image held-out test split is scored exactly once per run on the validation-selected checkpoint.", "", "\\paragraph{Architectures and ablations.}", "We compare four models implemented in \\texttt{code/train\\_gpu\\_benchmark.py}:", "(1) \\texttt{MLP\\_Baseline} (235,146 parameters): a two-hidden-layer perceptron ($784\\to 256\\to 128\\to 10$) serving as a non-convolutional baseline;", "(2) \\texttt{PlainCNN} (93,962 parameters): a three-stage convolutional network with ReLU activations, max pooling, and global average pooling without batch normalization or residual skips;", "(3) \\texttt{ResCNN\\_NoReg} (308,074 parameters): a three-stage residual ConvNet with batch normalization~\\citep{he2015deep,ioffe2015batch}, constant learning rate, zero dropout, and zero label smoothing; and", "(4) \\texttt{ResCNN\\_Full} (308,074 parameters): identical architecture augmented with dropout ($0.2$), label smoothing ($0.1$)~\\citep{szegedy2015rethinking}, weight decay ($10^{-4}$), and cosine annealing~\\citep{loshchilov2016sgdr}.", "", "\\paragraph{Automated provenance binding.}", "During training, every run writes standard binary TensorBoard scalar files (\\texttt{runs/tb/*/events.out.tfevents.*}) and Weights \\& Biases local run files (\\texttt{runs/wandb/*/files/wandb-\\{summary.json,history.jsonl\\}}).", "Running \\texttt{./veriloop bind} ingests these raw tracker outputs with zero third-party SDK dependencies, computes multi-seed mean $\\pm$ std and 95\\% Student-$t$ confidence intervals, and writes \\texttt{bound\\_metrics.txt}, \\texttt{bound\\_macros.tex}, \\texttt{bound\\_table.tex}, \\texttt{provenance\\_manifest.json}, and Okabe-Ito vector figures.", "", "\\input{bound/bound_table.tex}", "", "\\begin{figure}[t]", "  \\centering", "  \\includegraphics[width=\\columnwidth]{bound/bound_curves.pdf}", "  \\caption{\\textbf{Multi-seed validation accuracy trajectories bound directly from binary TensorBoard and W\\&B logs.} Shaded bands show $\\pm 1$ standard deviation across seeds 42--44 on NVIDIA RTX 3060 Ti.}", "  \\label{fig:gpu_curves}", "\\end{figure}", "", "\\begin{figure}[t]", "  \\centering", "  \\includegraphics[width=\\columnwidth]{bound/bound_bars.pdf}", "  \\caption{\\textbf{Held-out test accuracy, test loss, and validation accuracy with 95\\% Student-$t$ CIs automatically bound by \\texttt{./veriloop bind}.}}", "  \\label{fig:gpu_bars}", "\\end{figure}", "", "\\section{Results and Analysis}", "Table~\\ref{tab:bound_results} and Figures~\\ref{fig:gpu_curves}--\\ref{fig:gpu_bars} summarize all twelve real GPU training runs.", "Three concrete empirical observations emerge directly from the bound logs:", "", "\\paragraph{Residual connections and batch normalization dominate spatial generalization.}", "\\texttt{ResCNN\\_Full} achieves \\vlRescnnFullTestAcc{} held-out test accuracy (95\\% CI \\vlRescnnFullTestAccCi{}, validation \\vlRescnnFullValAcc{}), outperforming \\texttt{MLP\\_Baseline} (\\vlMlpBaselineTestAcc{}) and \\texttt{PlainCNN} (\\vlPlaincnnTestAcc{}).", "Interestingly, \\texttt{PlainCNN} without batch normalization or residual skips underperforms the higher-capacity \\texttt{MLP\\_Baseline} across all three seeds (0.8462--0.8544 vs.\\ 0.8788--0.8825), underscoring the importance of normalization and skip connections under short 8-epoch schedules.", "", "\\paragraph{Regularization improves accuracy while trading unsmoothed cross-entropy loss.}", "Adding dropout, label smoothing, weight decay, and cosine annealing (\\texttt{ResCNN\\_Full}) lifts held-out test accuracy over \\texttt{ResCNN\\_NoReg} from \\vlRescnnNoregTestAcc{} (CI \\vlRescnnNoregTestAccCi{}) to \\vlRescnnFullTestAcc{} (CI \\vlRescnnFullTestAccCi{}) while cutting across-seed standard deviation nearly in half (0.0065 to 0.0036).", "Conversely, raw unsmoothed test cross-entropy is slightly higher for \\texttt{ResCNN\\_Full} (\\vlRescnnFullTestLoss{}) than for \\texttt{ResCNN\\_NoReg} (\\vlRescnnNoregTestLoss{}), an expected effect of training with label smoothing~\\citep{szegedy2015rethinking}, which prevents overconfident logits while improving top-1 accuracy.", "", "\\section{Verification Audit and Reproducibility}", "All twelve GPU runs completed cleanly on NVIDIA GeForce RTX 3060 Ti (29--32\\,s per baseline run; 67--69\\,s per residual run; \\texttt{COMPLETED\\_OK} recorded in \\texttt{out/gpu\\_runs.log}).", "Running \\texttt{./veriloop gate} verifies:", "(1) \\texttt{trace\\_numbers.py}: 100\\% of reported decimals trace verbatim to \\texttt{bound\\_metrics.txt} and \\texttt{out/gpu\\_runs.log} with zero untraced numbers and zero sign mismatches;", "(2) \\texttt{audit\\_code.py}: zero HIGH or MEDIUM AST integrity violations in \\texttt{code/train\\_gpu\\_benchmark.py}; and", "(3) \\texttt{citation\\_audit.py}: all seven BibTeX keys fetched directly from arXiv verify cleanly online with grounded abstracts.", "Finally, \\texttt{./veriloop review-ui} exports \\texttt{review\\_ui.html}, enabling readers to click any highlighted metric or citation and jump straight to the underlying GPU log line or fetched arXiv abstract.", "", "\\bibliography{refs}", "\\bibliographystyle{icml2027}", "", "\\end{document}", "% ===== FILE: bound_table.tex =====", "% Auto-generated by VeriLoop paper_bind.py — 100% bound to raw logs", "\\begin{table}[t]", "\\centering", "\\caption{\\textbf{Multi-seed experiment results automatically bound from raw execution logs (mean $\\pm$ std).}}", "\\label{tab:bound_re _summary sha256=6cad45bbf0ad5d48 points=7 path=/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/runs/wandb/ResCNN_NoReg_s42/files/wandb-summary.json", "SOURCE format=wandb_history sha256=9b7729241c9a3db6 points=32 path=/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/runs/wandb/ResCNN_NoReg_s43/files/wandb-history.jsonl", "SOURCE format=wandb_summary sha256=0da5219c8d5eed68 points=7 path=/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/runs/wandb/ResCNN_NoReg_s43/files/wandb-summary.json", "SOURCE format=wandb_history sha256=055ea1ca840a41e5 points=32 path=/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/runs/wandb/ResCNN_NoReg_s44/files/wandb-history.jsonl", "SOURCE format=wandb_summary sha256=0fe3d6ddb5656d31 points=7 path=/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/runs/wandb/ResCNN_NoReg_s44/files/wandb-summary.json", "", "BOUND MLP_Baseline | test_acc | n=3 | 0.8801±0.0021 [0.8750,0.8852] | pct=88.01±0.21% | s42=0.8825 s43=0.8791 s44=0.8788", "BOUND MLP_Baseline | test_loss | n=3 | 0.3424±0.0013 [0.3391,0.3458] | s42=0.3410 s43=0.3436 s44=0.3426", "BOUND MLP_Baseline | val_acc | n=3 | 0.8875±0.0024 [0.8815,0.8936] | pct=88.75±0.24% | s42=0.8902 s43=0.8870 s44=0.8854", "BOUND PlainCNN | test_acc | n=3 | 0.8495±0.0043 [0.8388,0.8602] | pct=84.95±0.43% | s42=0.8462 s43=0.8480 s44=0.8544", "BOUND PlainCNN | test_loss | n=3 | 0.4193±0.0065 [0.4032,0.4354] | s42=0.4268 s43=0.4163 s44=0.4149", "BOUND PlainCNN | val_acc | n=3 | 0.8564±0.0018 [0.8520,0.8609] | pct=85.64±0.18% | s42=0.8545 s43=0.8568 s44=0.8580", "BOUND ResCNN_Full | test_acc | n=3 | 0.9251±0.0036 [0.9163,0.9339] | pct=92.51±0.36% | s42=0.9210 s43=0.9271 s44=0.9272", "BOUND ResCNN_Full | test_loss | n=3 | 0.2926±0.0062 [0.2772,0.3081] | s42=0.2996 s43=0.2906 s44=0.2877", "BOUND ResCNN_Full | val_acc | n=3 | 0.9284±0.0026 [0.9219,0.9349] | pct=92.84±0.26% | s42=0.9256 s43=0.9288 s44=0.9308", "BOUND ResCNN_NoReg | test_acc | n=3 | 0.9086±0.0065 [0.8925,0.9246] | pct=90.86±0.65% | s42=0.9080 s43=0.9153 s44=0.9024", "BOUND ResCNN_NoReg | test_loss | n=3 | 0.2644±0.0135 [0.2308,0.2980] | s42=0.2615 s43=0.2526 s44=0.2791", "BOUND ResCNN_NoReg | val_acc | n=3 | 0.9128±0.0051 [0.9000,0.9255] | pct=91.28±0.51% | s42=0.9115 s43=0.9184 s44=0.9084", "COMPLETED_OK"]}}, "code": {"/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/code/train_gpu_benchmark.py": {"path": "/home/shawnyang/Documents/VeriLoop/examples/gpu-dl-benchmark/code/train_gpu_benchmark.py", "name": "train_gpu_benchmark.py", "sha256": "603b5d97d62a45a6", "lines": ["#!/usr/bin/env python3", "\"\"\"Real Multi-Seed GPU Deep Learning Benchmark for VeriLoop End-to-End Showcase.", "", "Trains 4 PyTorch architectures across 3 independent random seeds (12 runs total)", "on Fashion-MNIST with strict train (50k) / val (10k) / held-out test (10k) separation:", "  1. MLP_Baseline  : 2-hidden-layer MLP (non-convolutional baseline)", "  2. PlainCNN      : 3-stage ConvNet without residual skips or cosine annealing", "  3. ResCNN_NoReg  : Residual ConvNet + BatchNorm (ablation: no dropout, no label smoothing, constant LR)", "  4. ResCNN_Full   : Residual ConvNet + BatchNorm + Dropout(0.2) + LabelSmoothing(0.1) + CosineAnnealingLR", "", "Model checkpoint selection uses validation accuracy ONLY; the held-out test split is", "scored strictly once on the validation-selected checkpoint.", "", "Simultaneously emits three industry-standard log formats for `./veriloop bind`:", "  - TensorBoard binary event files (`runs/tb/<method>_s<seed>/events.out.tfevents.*`)", "  - Weights & Biases local run files (`runs/wandb/<method>_s<seed>/files/wandb-{summary.json,history.jsonl}`)", "  - Per-epoch CSV logs (`runs/csv/<method>_s<seed>.csv`) and canonical stdout (`out/gpu_runs.log`)", "\"\"\"", "import argparse", "import csv", "import json", "import math", "import os", "import random", "import sys", "import time", "from datetime import datetime, timezone", "from pathlib import Path", "", "import torch", "import torch.nn as nn", "import torch.nn.functional as F", "from torch.utils.data import DataLoader, Subset", "from torchvision import datasets, transforms", "", "REPO_ROOT = Path(__file__).resolve().parents[3]", "sys.path.insert(0, str(REPO_ROOT / \"tools\"))", "import paper_bind as pb  # noqa: E402", "", "", "def seed_everything(seed: int):", "    random.seed(seed)", "    torch.manual_seed(seed)", "    if torch.cuda.is_available():", "        torch.cuda.manual_seed_all(seed)", "    torch.backends.cudnn.deterministic = True", "    torch.backends.cudnn.benchmark = False", "", "", "class MLPBaseline(nn.Module):", "    def __init__(self):", "        super().__init__()", "        self.net = nn.Sequential(", "            nn.Flatten(),", "            nn.Linear(28 * 28, 256),", "            nn.ReLU(inplace=True),", "            nn.Linear(256, 128),", "            nn.ReLU(inplace=True),", "            nn.Linear(128, 10),", "        )", "", "    def forward(self, x):", "        return self.net(x)", "", "", "class PlainCNN(nn.Module):", "    def __init__(self):", "        super().__init__()", "        self.features = nn.Sequential(", "            nn.Conv2d(1, 32, 3, padding=1),", "            nn.ReLU(inplace=True),", "            nn.MaxPool2d(2),", "            nn.Conv2d(32, 64, 3, padding=1),", "            nn.ReLU(inplace=True),", "            nn.MaxPool2d(2),", "            nn.Conv2d(64, 128, 3, padding=1),", "            nn.ReLU(inplace=True),", "            nn.AdaptiveAvgPool2d(1),", "        )", "        self.head = nn.Linear(128, 10)", "", "    def forward(self, x):", "        return self.head(self.features(x).flatten(1))", "", "", "class ResBlock(nn.Module):", "    def __init__(self, in_ch: int, out_ch: int, stride: int = 1):", "        super().__init__()", "        self.conv1 = nn.Conv2d(in_ch, out_ch, 3, stride=stride, padding=1, bias=False)", "        self.bn1 = nn.BatchNorm2d(out_ch)", "        self.conv2 = nn.Conv2d(out_ch, out_ch, 3, stride=1, padding=1, bias=False)", "        self.bn2 = nn.BatchNorm2d(out_ch)", "        self.skip = (", "            nn.Sequential(nn.Conv2d(in_ch, out_ch, 1, stride=stride, bias=False), nn.BatchNorm2d(out_ch))", "            if (stride != 1 or in_ch != out_ch)", "            else nn.Identity()", "        )", "", "    def forward(self, x):", "        h = F.relu(self.bn1(self.conv1(x)), inplace=True)", "        h = self.bn2(self.conv2(h))", "        return F.relu(h + self.skip(x), inplace=True)", "", "", "class ResCNN(nn.Module):", "    def __init__(self, dropout: float = 0.0):", "        super().__init__()", "        self.stem = nn.Sequential(nn.Conv2d(1, 32, 3, padding=1, bias=False), nn.BatchNorm2d(32), nn.ReLU(inplace=True))", "        self.b1 = ResBlock(32, 32, stride=1)", "        self.b2 = ResBlock(32, 64, stride=2)", "        self.b3 = ResBlock(64, 128, stride=2)", "        self.pool = nn.AdaptiveAvgPool2d(1)", "        self.drop = nn.Dropout(dropout)", "        self.head = nn.Linear(128, 10)", "", "    def forward(self, x):", "        h = self.b3(self.b2(self.b1(self.stem(x))))", "        h = self.drop(self.pool(h).flatten(1))", "        return self.head(h)", "", "", "def build_model(method: str) -> nn.Module:", "    if method == \"MLP_Baseline\":", "        return MLPBaseline()", "    if method == \"PlainCNN\":", "        return PlainCNN()", "    if method == \"ResCNN_NoReg\":", "        return ResCNN(dropout=0.0)", "    if method == \"ResCNN_Full\":", "        return ResCNN(dropout=0.2)", "    raise ValueError(f\"Unknown method: {method}\")", "", "", "@torch.no_grad()", "def evaluate_split(model: nn.Module, loader: DataLoader, device: torch.device) -> tuple[float, float]:", "    model.eval()", "    total_loss = 0.0", "    correct = 0", "    total = 0", "    for xb, yb in loader:", "        xb, yb = xb.to(device, non_blocking=True), yb.to(device, non_blocking=True)", "        logits = model(xb)", "        total_loss += F.cross_entropy(logits, yb, reduction=\"sum\").item()", "        correct += (logits.argmax(dim=1) == yb).sum().item()", "        total += yb.size(0)", "    return correct / total, total_loss / total", "", "", "def train_one(method: str, seed: int, epochs: int, batch_size: int, train_ds, val_ds, test_ds, device: torch.device, out_root: Path):", "    seed_everything(seed)", "    gen = torch.Generator().manual_seed(seed)", "    train_loader = DataLoader(train_ds, batch_size=batch_size, shuffle=True, generator=gen, num_workers=2, pin_memory=(device.type == \"cuda\"))", "    val_loader = DataLoader(val_ds, batch_size=512, shuffle=False, num_workers=2, pin_memory=(device.type == \"cuda\"))", "    test_loader = DataLoader(test_ds, batch_size=512, shuffle=False, num_workers=2, pin_memory=(device.type == \"cuda\"))", "", "    model = build_model(method).to(device)", "    n_params = sum(p.numel() for p in model.parameters())", "    lr = 1.5e-3 if method != \"MLP_Baseline\" else 2.0e-3", "    wd = 1e-4 if method == \"ResCNN_Full\" else 0.0", "    label_smooth = 0.1 if method == \"ResCNN_Full\" else 0.0", "    opt = torch.optim.AdamW(model.parameters(), lr=lr, weight_decay=wd)", "    sched = torch.optim.lr_scheduler.CosineAnnealingLR(opt, T_max=epochs) if method == \"ResCNN_Full\" else None", "", "    best_val_acc = -1.0", "    best_epoch = 0", "    best_state = None", "    history = []", "    tb_records = []", "    t0 = time.time()", "", "    for ep in range(1, epochs + 1):", "        model.train()", "        tr_loss_sum = 0.0", "        tr_correct = 0", "        tr_n = 0", "        for xb, yb in train_loader:", "            xb, yb = xb.to(device, non_blocking=True), yb.to(device, non_blocking=True)", "            opt.zero_grad(set_to_none=True)", "            logits = model(xb)", "            loss = F.cross_entropy(logits, yb, label_smoothing=label_smooth)", "            loss.backward()", "            opt.step()", "            tr_loss_sum += loss.item() * yb.size(0)", "            tr_correct += (logits.argmax(dim=1) == yb).sum().item()", "            tr_n += yb.size(0)", "        if sched is not None:", "            sched.step()", "", "        tr_acc = tr_correct / tr_n", "        tr_loss = tr_loss_sum / tr_n", "        val_acc, val_loss = evaluate_split(model, val_loader, device)", "        if val_acc > best_val_acc:", "            best_val_acc = val_acc", "            best_epoch = ep", "            best_state = {k: v.detach().cpu().clone() for k, v in model.state_dict().items()}", "", "        row = {", "            \"method\": method, \"seed\": seed, \"epoch\": ep,", "            \"train_acc\": round(tr_acc, 6), \"train_loss\": round(tr_loss, 6),", "            \"val_acc\": round(val_acc, 6), \"val_loss\": round(val_loss, 6),", "        }", "        history.append(row)", "        tb_records.append((ep, \"val_acc\", val_acc))", "        tb_records.append((ep, \"val_loss\", val_loss))", "        tb_records.append((ep, \"train_loss\", tr_loss))", "", "    # Strict validation-only selection: score held-out test set ONCE using best_val_acc checkpoint", "    model.load_state_dict(best_state)", "    test_acc, test_loss = evaluate_split(model, test_loader, device)", "    elapsed = time.time() - t0", "    tb_records.append((epochs, \"test_acc\", test_acc))", "    tb_records.append((epochs, \"test_loss\", test_loss))", "", "    # 1. Write TensorBoard tfevents", "    tb_path = out_root / \"runs/tb\" / f\"{method}_s{seed}\" / f\"events.out.tfevents.{method}.s{seed}\"", "    pb.write_tfevents_scalars(tb_path, tb_records)", "", "    # 2. Write W&B local run files", "    wb_dir = out_root / \"runs/wandb\" / f\"{method}_s{seed}\" / \"files\"", "    wb_dir.mkdir(parents=True, exist_ok=True)", "    (wb_dir / \"config.json\").write_text(json.dumps({", "        \"method\": method, \"seed\": seed, \"epochs\": epochs, \"batch_size\": batch_size,", "        \"lr\": lr, \"weight_decay\": wd, \"label_smoothing\": label_smooth, \"n_params\": n_params,", "        \"selected_on\": \"val_acc\", \"device\": str(device),", "    }, indent=2), encoding=\"utf-8\")", "    (wb_dir / \"wandb-history.jsonl\").write_text(", "        \"\\n\".join(json.dumps(r) for r in history) + \"\\n\", encoding=\"utf-8\"", "    )", "    summary = {", "        \"method\": method, \"seed\": seed, \"_step\": epochs,", "        \"best_val_epoch\": best_epoch,", "        \"best_val_acc\": round(best_val_acc, 6),", "        \"val_acc\": round(best_val_acc, 6),", "        \"test_acc\": round(test_acc, 6),", "        \"test_loss\": round(test_loss, 6),", "        \"wall_time_s\": round(elapsed, 2),", "        \"n_params\": n_params,", "    }", "    (wb_dir / \"wandb-summary.json\").write_text(json.dumps(summary, indent=2), encoding=\"utf-8\")", "", "    # 3. Write CSV epoch log", "    csv_p = out_root / \"runs/csv\" / f\"{method}_s{seed}.csv\"", "    csv_p.parent.mkdir(parents=True, exist_ok=True)", "    with csv_p.open(\"w\", encoding=\"utf-8\", newline=\"\") as fh:", "        w = csv.DictWriter(fh, fieldnames=[\"method\", \"seed\", \"epoch\", \"train_acc\", \"train_loss\", \"val_acc\", \"val_loss\"])", "        w.writeheader()", "        w.writerows(history)", "", "    return summary", "", "", "def main():", "    ap = argparse.ArgumentParser(description=\"Run real multi-seed PyTorch GPU benchmark on Fashion-MNIST.\")", "    ap.add_argument(\"--out-root\", default=str(Path(__file__).resolve().parents[1]))", "    ap.add_argument(\"--data-dir\", default=\"/tmp/veriloop_fmnist_data\")", "    ap.add_argument(\"--epochs\", type=int, default=8)", "    ap.add_argument(\"--batch-size\", type=int, default=256)", "    ap.add_argument(\"--seeds\", type=int, nargs=\"+\", default=[42, 43, 44])", "    args = ap.parse_args()", "", "    out_root = Path(args.out_root).resolve()", "    (out_root / \"out\").mkdir(parents=True, exist_ok=True)", "    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")", "    gpu_name = torch.cuda.get_device_name(0) if device.type == \"cuda\" else \"CPU\"", "", "    tf = transforms.Compose([transforms.ToTensor(), transforms.Normalize((0.2860,), (0.3530,))])", "    full_train = datasets.FashionMNIST(args.data_dir, train=True, download=True, transform=tf)", "    test_ds = datasets.FashionMNIST(args.data_dir, train=False, download=True, transform=tf)", "", "    # Fixed 50,000 train / 10,000 validation split (seed 0) shared across all models", "    perm = torch.randperm(len(full_train), generator=torch.Generator().manual_seed(0)).tolist()", "    train_ds = Subset(full_train, perm[:50000])", "    val_ds = Subset(full_train, perm[50000:])", "", "    methods = [\"MLP_Baseline\", \"PlainCNN\", \"ResCNN_NoReg\", \"ResCNN_Full\"]", "    log_lines = [", "        f\"# VeriLoop Real GPU Deep Learning Showcase — Fashion-MNIST (50k train / 10k val / 10k test)\",", "        f\"# timestamp_utc={datetime.now(timezone.utc).isoformat()} device={device} gpu={gpu_name} torch={torch.__version__} epochs={args.epochs}\",", "    ]", "    print(log_lines[0], flush=True)", "    print(log_lines[1], flush=True)", "", "    for method in methods:", "        for seed in args.seeds:", "            res = train_one(method, seed, args.epochs, args.batch_size, train_ds, val_ds, test_ds, device, out_root)", "            line = (", "                f\"RUN method={method:14s} seed={seed} params={res['n_params']:7d} best_ep={res['best_val_epoch']} \"", "                f\"val_acc={res['val_acc']:.4f} test_acc={res['test_acc']:.4f} test_loss={res['test_loss']:.4f} \"", "                f\"wall_s={res['wall_time_s']:.2f}\"", "            )", "            log_lines.append(line)", "            print(line, flush=True)", "", "    log_lines.append(\"COMPLETED_OK\")", "    (out_root / \"out/gpu_runs.log\").write_text(\"\\n\".join(log_lines) + \"\\n\", encoding=\"utf-8\")", "    print(\"GPU_BENCHMARK_DONE -> out/gpu_runs.log\", flush=True)", "", "", "if __name__ == \"__main__\":", "    main()"]}}};
let currentFilter = 'all';
let currentTab = 'logs';
let currentFile = Object.keys(BUNDLE.logs)[0] || '';
let highlightLine = 0;

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const linksByLine = {};
for (const nl of BUNDLE.number_links) {
  (linksByLine[nl.line] ||= []).push(nl);
}
const citesByLine = {};
for (const cp of (BUNDLE.citations.pairs || [])) {
  (citesByLine[cp.line] ||= []).push(cp);
}

function setFilter(f) {
  currentFilter = f;
  for (const id of ['all','def','num']) document.getElementById('flt-'+id).classList.remove('active');
  document.getElementById(f==='all'?'flt-all':f==='defects'?'flt-def':'flt-num').classList.add('active');
  renderManuscript();
}

function decorateLine(ln, rawText) {
  let out = esc(rawText);
  const nls = linksByLine[ln] || [];
  const used = new Set();
  for (const nl of nls) {
    if (used.has(nl.token)) continue;
    used.add(nl.token);
    const cls = nl.status === 'TRACED' ? 'tok-traced' : (nl.status === 'SIGN_MISMATCH' ? 'tok-sign' : 'tok-untraced');
    const tip = nl.status + (nl.all_sources.length ? ' -> ' + nl.all_sources.join(', ') : '');
    const idx = BUNDLE.number_links.indexOf(nl);
    const re = new RegExp('(?<![\w.])' + nl.token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    out = out.replace(re, `<span class="tok ${cls}" title="${esc(tip)}" onclick="jumpNumber(${idx})">${esc(nl.token)}</span>`);
  }
  const cps = citesByLine[ln] || [];
  for (const cp of cps) {
    const isErr = ['MISSING_BIB','UNRESOLVED_REFERENCE','TITLE_MISMATCH','AUTHOR_MISMATCH','YEAR_MISMATCH','RETRACTED_PAPER','UNRESOLVED_ARXIV'].includes(cp.status);
    const cls = isErr ? 'tok-cite-err' : 'tok-cite';
    const cidx = BUNDLE.citations.pairs.indexOf(cp);
    const safeKey = esc(cp.key);
    out = out.replace(safeKey, `<span class="tok ${cls}" title="${esc(cp.status)}" onclick="jumpCite(${cidx})">${safeKey}</span>`);
  }
  return out;
}

function renderManuscript() {
  const q = (document.getElementById('ms-search').value || '').toLowerCase();
  const el = document.getElementById('ms-view');
  const rows = [];
  BUNDLE.report_lines.forEach((line, i) => {
    const ln = i + 1;
    const nls = linksByLine[ln] || [];
    const cps = citesByLine[ln] || [];
    const hasDef = nls.some(x => x.status !== 'TRACED') || cps.some(x => x.status.includes('MISSING') || x.status.includes('MISMATCH') || x.status.includes('UNRESOLVED'));
    if (currentFilter === 'defects' && !hasDef) return;
    if (currentFilter === 'numbers' && !nls.length && !cps.length) return;
    if (q && !line.toLowerCase().includes(q)) return;
    rows.push(`<div class="code-line" id="ms-L${ln}"><span class="ln">${ln}</span><span class="txt">${decorateLine(ln, line)}</span></div>`);
  });
  el.innerHTML = rows.join('') || '<div class="card">No matching lines under current filter.</div>';
}

function showBanner(msg) {
  const b = document.getElementById('banner');
  b.style.display = msg ? 'block' : 'none';
  b.innerHTML = msg;
}

function jumpNumber(idx) {
  const nl = BUNDLE.number_links[idx];
  if (!nl) return;
  if (nl.target_file && BUNDLE.logs[nl.target_file]) {
    currentTab = 'logs';
    currentFile = nl.target_file;
    highlightLine = nl.target_line;
    updateTabs();
    showBanner(`<b>${esc(nl.token)}</b> [${esc(nl.status)}] &rarr; <code>${esc(BUNDLE.logs[nl.target_file].name)}:${nl.target_line}</code>`);
    renderRight();
  } else {
    currentTab = 'logs';
    updateTabs();
    showBanner(`<b>${esc(nl.token)}</b> [${esc(nl.status)}] — No matching log entry found in indexed logs.`);
    renderRight();
  }
}

function jumpCite(cidx) {
  const cp = BUNDLE.citations.pairs[cidx];
  currentTab = 'cites';
  updateTabs();
  showBanner(`Citation <b>${esc(cp.key)}</b> (L${cp.line}) — Status: <b>${esc(cp.status)}</b>`);
  renderRight(cp.key);
}

function jumpCode(file, ln) {
  if (!BUNDLE.code[file]) return;
  currentTab = 'code';
  currentFile = file;
  highlightLine = ln;
  updateTabs();
  showBanner(`AST Finding &rarr; <code>${esc(BUNDLE.code[file].name)}:${ln}</code>`);
  renderRight();
}

function switchTab(t) {
  currentTab = t;
  highlightLine = 0;
  showBanner('');
  if (t === 'logs' && !BUNDLE.logs[currentFile]) currentFile = Object.keys(BUNDLE.logs)[0] || '';
  if (t === 'code' && !BUNDLE.code[currentFile]) currentFile = Object.keys(BUNDLE.code)[0] || '';
  updateTabs();
  renderRight();
}

function updateTabs() {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === currentTab));
  const sel = document.getElementById('file-sel');
  if (currentTab === 'logs' || currentTab === 'code') {
    const map = currentTab === 'logs' ? BUNDLE.logs : BUNDLE.code;
    sel.style.display = 'inline-block';
    sel.innerHTML = Object.entries(map).map(([k, v]) => `<option value="${esc(k)}" ${k===currentFile?'selected':''}>${esc(v.name)} (${v.sha256.slice(0,8)})</option>`).join('');
  } else {
    sel.style.display = 'none';
  }
}

function renderRight(focusCiteKey) {
  const el = document.getElementById('right-view');
  const sel = document.getElementById('file-sel');
  if (currentTab === 'logs' || currentTab === 'code') {
    if (sel.value) currentFile = sel.value;
    const map = currentTab === 'logs' ? BUNDLE.logs : BUNDLE.code;
    const fobj = map[currentFile];
    let htmlParts = [];
    if (currentTab === 'code' && (BUNDLE.ast.findings || []).length) {
      htmlParts.push('<div class="card"><h4>Python AST Integrity Findings</h4>' +
        BUNDLE.ast.findings.map(f => {
          const pcls = f.severity === 'HIGH' ? 'pill-high' : 'pill-med';
          const fullPath = Object.keys(BUNDLE.code).find(k => k.endsWith(f.file)) || f.file;
          return `<div style="margin:4px 0;cursor:pointer" onclick="jumpCode('${esc(fullPath)}', ${f.line||1})"><span class="pill ${pcls}">${esc(f.severity)}</span><code>${esc(f.code)}</code> ${esc(f.file)}:${f.line} — ${esc(f.detail||'')}</div>`;
        }).join('') + '</div>');
    }
    if (!fobj) {
      htmlParts.push('<div class="card">No files loaded in this tab.</div>');
      el.innerHTML = htmlParts.join('');
      return;
    }
    htmlParts.push(fobj.lines.map((l, i) => {
      const ln = i + 1;
      const hl = ln === highlightLine ? ' hl-pulse' : '';
      return `<div class="code-line${hl}" id="r-L${ln}"><span class="ln">${ln}</span><span class="txt">${esc(l)}</span></div>`;
    }).join(''));
    el.innerHTML = htmlParts.join('');
    if (highlightLine > 0) {
      const target = document.getElementById('r-L' + highlightLine);
      if (target) target.scrollIntoView({behavior: 'smooth', block: 'center'});
    }
  } else if (currentTab === 'cites') {
    const pairs = BUNDLE.citations.pairs || [];
    const seen = new Map();
    for (const p of pairs) { if (!seen.has(p.key)) seen.set(p.key, p); }
    const items = Array.from(seen.values());
    if (focusCiteKey) items.sort((a,b) => (a.key===focusCiteKey?-1:b.key===focusCiteKey?1:0));
    el.innerHTML = items.map(p => {
      const isErr = ['MISSING_BIB','UNRESOLVED_REFERENCE','TITLE_MISMATCH','AUTHOR_MISMATCH','YEAR_MISMATCH','RETRACTED_PAPER'].includes(p.status);
      const pcls = isErr ? 'pill-high' : 'pill-ok';
      const meta = p.online || {};
      const cva = p.claim_vs_abstract ? `<div class="meta"><b>Claim vs Abstract:</b> ${esc(p.claim_vs_abstract.status)} (overlap=${p.claim_vs_abstract.overlap})</div>` : '';
      const absHtml = meta.abstract ? `<div class="abs"><b>Fetched Real Abstract (${esc(meta.source||'')}):</b> ${esc(meta.abstract.slice(0, 650))}</div>` : '';
      return `<div class="card" style="${p.key===focusCiteKey?'border-color:#38bdf8':''}">
        <h4><span class="pill ${pcls}">${esc(p.status)}</span>${esc(p.key)}</h4>
        <div class="meta"><b>Bib Title:</b> ${esc(p.bib_title || meta.title || '(none)')} | <b>Year:</b> ${esc(p.bib_year || meta.year || '-')}</div>
        <div class="meta"><b>Manuscript Context (L${p.line}):</b> ${esc(p.sentence)}</div>
        ${cva}${absHtml}
      </div>`;
    }).join('') || '<div class="card">No citations extracted.</div>';
  } else {
    const lintHtml = BUNDLE.lint_messages.length
      ? BUNDLE.lint_messages.map(m => `<div><code>${esc(m)}</code></div>`).join('')
      : '<span class="pill pill-ok">OK</span> 0 prose lint issues';
    const shaHtml = [
      ...BUNDLE.report_files.map(f => `<li><code>${esc(f.name)}</code> sha256=<code>${esc(f.sha256)}</code></li>`),
      ...Object.values(BUNDLE.logs).map(f => `<li><code>${esc(f.name)}</code> sha256=<code>${esc(f.sha256)}</code></li>`),
    ].join('');
    el.innerHTML = `<div class="card"><h4>Best-Paper Prose &amp; Figure Lint</h4>${lintHtml}</div>
      <div class="card"><h4>SHA-256 Artifact Provenance (${esc(BUNDLE.generated_utc)})</h4><ul>${shaHtml}</ul></div>`;
  }
}

updateTabs();
renderManuscript();
renderRight();
</script>
